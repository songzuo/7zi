# Kubernetes Deployment Configuration
# AI 智能体认证和授权系统

apiVersion: v1
kind: Namespace
metadata:
  name: openclaw-auth
  labels:
    name: openclaw-auth
    app: openclaw

---
# ConfigMap for application configuration
apiVersion: v1
kind: ConfigMap
metadata:
  name: auth-config
  namespace: openclaw-auth
data:
  JWT_EXPIRES_IN: "3600"
  JWT_REFRESH_EXPIRES_IN: "604800"
  BCRYPT_ROUNDS: "12"
  MAX_LOGIN_ATTEMPTS: "5"
  ACCOUNT_LOCKOUT_DURATION: "900"
  AUDIT_LOG_RETENTION_DAYS: "90"
  NODE_ENV: "production"

---
# Secret for sensitive data
apiVersion: v1
kind: Secret
metadata:
  name: auth-secrets
  namespace: openclaw-auth
type: Opaque
stringData:
  JWT_SECRET: "your-super-secret-jwt-key-change-this-in-production"
  POSTGRES_PASSWORD: "your-postgres-password"

---
# Persistent Volume Claim for data
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: auth-data-pvc
  namespace: openclaw-auth
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi
  storageClassName: standard

---
# Deployment
apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-deployment
  namespace: openclaw-auth
  labels:
    app: auth
    version: v1.11.0
spec:
  replicas: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: auth
  template:
    metadata:
      labels:
        app: auth
        version: v1.11.0
    spec:
      serviceAccountName: auth-service-account
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        fsGroup: 1001
      containers:
      - name: auth
        image: openclaw/auth:v1.11.0
        imagePullPolicy: Always
        ports:
        - name: http
          containerPort: 3000
          protocol: TCP
        env:
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: auth-secrets
              key: JWT_SECRET
        - name: JWT_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_EXPIRES_IN
        - name: JWT_REFRESH_EXPIRES_IN
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: JWT_REFRESH_EXPIRES_IN
        - name: BCRYPT_ROUNDS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: BCRYPT_ROUNDS
        - name: MAX_LOGIN_ATTEMPTS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: MAX_LOGIN_ATTEMPTS
        - name: ACCOUNT_LOCKOUT_DURATION
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: ACCOUNT_LOCKOUT_DURATION
        - name: AUDIT_LOG_RETENTION_DAYS
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: AUDIT_LOG_RETENTION_DAYS
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: auth-config
              key: NODE_ENV
        - name: DATABASE_PATH
          value: "/app/data/auth.db"
        volumeMounts:
        - name: auth-data
          mountPath: /app/data
        - name: auth-logs
          mountPath: /app/logs
        resources:
          requests:
            memory: "256Mi"
            cpu: "250m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        livenessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api/health
            port: 3000
          initialDelaySeconds: 10
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
      volumes:
      - name: auth-data
        persistentVolumeClaim:
          claimName: auth-data-pvc
      - name: auth-logs
        emptyDir: {}

---
# Service
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: openclaw-auth
  labels:
    app: auth
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 3000
    protocol: TCP
    name: http
  selector:
    app: auth

---
# Ingress
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: auth-ingress
  namespace: openclaw-auth
  annotations:
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/rate-limit: "100"
    nginx.ingress.kubernetes.io/rate-limit-window: "1m"
spec:
  tls:
  - hosts:
    - auth.openclaw.com
    secretName: auth-tls
  rules:
  - host: auth.openclaw.com
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: auth-service
            port:
              number: 80

---
# Horizontal Pod Autoscaler
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: auth-hpa
  namespace: openclaw-auth
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: auth-deployment
  minReplicas: 3
  maxReplicas: 10
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: 70
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: 80

---
# Service Account
apiVersion: v1
kind: ServiceAccount
metadata:
  name: auth-service-account
  namespace: openclaw-auth

---
# Pod Disruption Budget
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: auth-pdb
  namespace: openclaw-auth
spec:
  minAvailable: 2
  selector:
    matchLabels:
      app: auth

---
# Network Policy
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-network-policy
  namespace: openclaw-auth
spec:
  podSelector:
    matchLabels:
      app: auth
  policyTypes:
  - Ingress
  - Egress
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          name: openclaw-auth
    ports:
    - protocol: TCP
      port: 3000
  egress:
  - to:
    - namespaceSelector: {}
    ports:
    - protocol: TCP
      port: 53
    - protocol: UDP
      port: 53
  - to:
    - podSelector:
        matchLabels:
          app: postgres
    ports:
    - protocol: TCP
      port: 5432