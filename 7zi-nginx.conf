# HTTP 重定向到 HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name 7zi.com www.7zi.com;

    # Gmail Pub/Sub 回调端点 (HTTP)
    # 代理到 Next.js 容器 (端口 3000)
    location /gmail-pubsub {
        proxy_pass http://7zi-frontend:3000/gmail-pubsub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查端点 (HTTP)
    location /health {
        proxy_pass http://7zi-frontend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 其他请求重定向到 HTTPS
    location / {
        return 301 https://$server_name$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name 7zi.com www.7zi.com;

    # SSL 证书配置
    ssl_certificate /web/ssl_unified/7zi.com.crt;
    ssl_certificate_key /web/ssl_unified/7zi.com.key;

    # SSL 安全配置
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5:ECDHE-RSA-AES256-GCM-SHA512:DHE-RSA-AES256-GCM-SHA512:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;
    ssl_session_tickets off;

    # 安全头
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # 主应用路由 - 代理到 Next.js 容器
    location / {
        proxy_pass http://7zi-frontend:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;

        # 超时设置
        proxy_connect_timeout 30s;
        proxy_send_timeout 30s;
        proxy_read_timeout 30s;
    }

    # Next.js 静态文件
    location /_next/static {
        proxy_pass http://7zi-frontend:3000/_next/static;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 图片优化路由
    location /_next/image {
        proxy_pass http://7zi-frontend:3000/_next/image;
        expires 7d;
        add_header Cache-Control "public, max-age=604800";
    }

    # 静态资源
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        proxy_pass http://7zi-frontend:3000;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Gmail Pub/Sub 回调端点 (HTTPS)
    # 代理到 Next.js 容器 (端口 3000)
    location /gmail-pubsub {
        proxy_pass http://7zi-frontend:3000/gmail-pubsub;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 健康检查端点 (HTTPS)
    location /health {
        proxy_pass http://7zi-frontend:3000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # Gzip 压缩（优化级别）
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # 日志
    access_log /var/log/nginx/7zi.com-https.access.log;
    error_log /var/log/nginx/7zi.com-https.error.log;
}
