# Core configuration
core:
  app_name: "7zi-monitoring"
  version: "1.10.0"
  log_level: "INFO"

# Metrics collection settings
collection:
  interval_seconds: 10
  retention_days: 30
  aggregation_intervals:
    - 1m
    - 5m
    - 15m
    - 1h
    - 1d

# System metrics collection
system_metrics:
  cpu:
    enabled: true
    interval_seconds: 5
  memory:
    enabled: true
    interval_seconds: 5
  disk:
    enabled: true
    interval_seconds: 30
    paths:
      - /
  network:
    enabled: true
    interval_seconds: 5

# Application metrics
application_metrics:
  response_time:
    enabled: true
    percentiles:
      - 50
      - 90
      - 95
      - 99
  throughput:
    enabled: true
    window_seconds: 60
  error_rate:
    enabled: true
    window_seconds: 60

# Business metrics (custom)
business_metrics:
  enabled: true
  custom_metrics:
    - name: "orders_per_minute"
      type: "counter"
      description: "Orders processed per minute"
    - name: "active_users"
      type: "gauge"
      description: "Currently active users"
    - name: "api_latency_ms"
      type: "histogram"
      description: "API request latency in milliseconds"

# Storage configuration
storage:
  backend: "sqlite"  # sqlite, postgresql, memory
  sqlite:
    path: "/var/lib/7zi-monitoring/metrics.db"
    pool_size: 5
  postgresql:
    host: "localhost"
    port: 5432
    database: "monitoring"
    user: "monitoring"
    password: "${DB_PASSWORD}"
    pool_size: 10
  memory:
    max_points: 100000
  retention:
    raw_data_days: 7
    aggregated_data_days: 90

# Auto-scaling configuration
scaling:
  enabled: true
  provider: "volcengine"  # volcengine, kubernetes, manual
  
  # Minimum and maximum instances
  limits:
    min_instances: 2
    max_instances: 20
  
  # Cooldown periods
  cooldown:
    scale_up_seconds: 60
    scale_down_seconds: 300
  
  # Scaling rules
  rules:
    - name: "cpu_based"
      metric: "system.cpu.usage"
      metric_type: "average"
      window_seconds: 60
      scale_up_threshold: 70
      scale_down_threshold: 30
      scale_up_step: 2
      scale_down_step: 1
      
    - name: "memory_based"
      metric: "system.memory.usage"
      metric_type: "average"
      window_seconds: 120
      scale_up_threshold: 80
      scale_down_threshold: 40
      scale_up_step: 1
      scale_down_step: 1
      
    - name: "response_time_based"
      metric: "application.response_time.p95"
      metric_type: "average"
      window_seconds: 60
      scale_up_threshold: 1000  # ms
      scale_down_threshold: 200  # ms
      scale_up_step: 2
      scale_down_step: 1

  # Predictive scaling
  predictive:
    enabled: true
    model: "linear_regression"  # linear_regression, arima, prophet
    forecast_horizon_minutes: 30
    training_window_hours: 168  # 1 week
    confidence_threshold: 0.8

# Alerting configuration
alerting:
  enabled: true
  
  # Default channels
  default_channels:
    - "log"
  
  # Channel configurations
  channels:
    webhook:
      url: "${ALERT_WEBHOOK_URL}"
      method: "POST"
      headers:
        Content-Type: "application/json"
      timeout_seconds: 10
      retry_count: 3
      
    email:
      smtp_host: "${SMTP_HOST}"
      smtp_port: 587
      smtp_user: "${SMTP_USER}"
      smtp_password: "${SMTP_PASSWORD}"
      from_address: "alerts@7zi.com"
      to_addresses:
        - "ops@7zi.com"
        
    log:
      level: "INFO"
      include_context: true

  # Alert rules
  rules:
    # ===== CPU 告警 =====
    - name: "high_cpu"
      metric: "system.cpu.usage"
      condition: "greater_than"
      threshold: 85  # 从 80 调整到 85，减少误报
      duration_seconds: 90  # 从 60 增加到 90，避免瞬时波动
      level: "warning"
      message: "CPU usage is high: {{value}}%"
      channels:
        - "webhook"
        - "log"
        
    - name: "critical_cpu"
      metric: "system.cpu.usage"
      condition: "greater_than"
      threshold: 95
      duration_seconds: 30
      level: "critical"
      message: "CPU usage is critical: {{value}}%"
      channels:
        - "webhook"
        - "email"
        - "log"
        
    # ===== 内存告警 =====
    - name: "high_memory"
      metric: "system.memory.usage"
      condition: "greater_than"
      threshold: 85
      duration_seconds: 120
      level: "warning"
      message: "Memory usage is high: {{value}}%"
      channels:
        - "webhook"
        - "log"
        
    - name: "critical_memory"
      metric: "system.memory.usage"
      condition: "greater_than"
      threshold: 95
      duration_seconds: 60
      level: "critical"
      message: "Memory usage is critical: {{value}}%"
      channels:
        - "webhook"
        - "email"
        - "log"
        
    # ===== 磁盘空间告警 (新增 - 高优先级) =====
    - name: "disk_space_warning"
      metric: "system.disk.usage"
      condition: "greater_than"
      threshold: 85
      duration_seconds: 60
      level: "warning"
      message: "Disk usage is high: {{value}}%"
      channels:
        - "webhook"
        - "log"
        
    - name: "disk_space_critical"
      metric: "system.disk.usage"
      condition: "greater_than"
      threshold: 95
      duration_seconds: 30
      level: "critical"
      message: "Disk space critical: {{value}}%. Service may become unavailable!"
      channels:
        - "webhook"
        - "email"
        - "log"
        
    # ===== 磁盘 I/O 等待告警 (新增) =====
    - name: "disk_io_wait_high"
      metric: "system.disk.io_wait"
      condition: "greater_than"
      threshold: 50
      duration_seconds: 120
      level: "warning"
      message: "Disk I/O wait is high: {{value}}%"
      channels:
        - "webhook"
        - "log"
        
    # ===== 网络告警 (新增) =====
    - name: "network_packet_loss"
      metric: "system.network.packet_loss"
      condition: "greater_than"
      threshold: 1
      duration_seconds: 60
      level: "warning"
      message: "Network packet loss detected: {{value}}%"
      channels:
        - "webhook"
        - "log"
        
    - name: "network_latency_high"
      metric: "system.network.latency_ms"
      condition: "greater_than"
      threshold: 100
      duration_seconds: 60
      level: "warning"
      message: "Network latency is high: {{value}}ms"
      channels:
        - "webhook"
        - "log"
        
    # ===== 数据库告警 (新增) =====
    - name: "db_connection_pool_high"
      metric: "database.connection_pool.usage"
      condition: "greater_than"
      threshold: 80
      duration_seconds: 60
      level: "warning"
      message: "Database connection pool usage is high: {{value}}%"
      channels:
        - "webhook"
        - "log"
        
    - name: "db_connection_pool_critical"
      metric: "database.connection_pool.usage"
      condition: "greater_than"
      threshold: 95
      duration_seconds: 30
      level: "critical"
      message: "Database connection pool nearly exhausted: {{value}}%"
      channels:
        - "webhook"
        - "email"
        - "log"
        
    - name: "db_query_time_high"
      metric: "database.query_time.p95"
      condition: "greater_than"
      threshold: 1000
      duration_seconds: 60
      level: "warning"
      message: "Database query time is slow: {{value}}ms"
      channels:
        - "webhook"
        - "log"
        
    # ===== 响应时间告警 (优化阈值，分级) =====
    - name: "response_time_warning"
      metric: "application.response_time.p95"
      condition: "greater_than"
      threshold: 1000  # 从 2000 降低到 1000，更早发现问题
      duration_seconds: 60
      level: "warning"
      message: "Response time is elevated: {{value}}ms"
      channels:
        - "webhook"
        - "log"
        
    - name: "response_time_critical"
      metric: "application.response_time.p95"
      condition: "greater_than"
      threshold: 3000  # 新增 critical 级别
      duration_seconds: 30
      level: "critical"
      message: "Response time is critical: {{value}}ms"
      channels:
        - "webhook"
        - "email"
        - "log"
        
    # ===== 错误率告警 =====
    - name: "error_rate_warning"
      metric: "application.error_rate"
      condition: "greater_than"
      threshold: 1  # 新增 warning 级别
      duration_seconds: 60
      level: "warning"
      message: "Error rate is elevated: {{value}}%"
      channels:
        - "webhook"
        - "log"
        
    - name: "high_error_rate"
      metric: "application.error_rate"
      condition: "greater_than"
      threshold: 5
      duration_seconds: 60
      level: "critical"
      message: "Error rate is high: {{value}}%"
      channels:
        - "webhook"
        - "email"
        - "log"
        
    # ===== 业务指标告警 (新增) =====
    - name: "request_rate_drop"
      metric: "application.throughput"
      condition: "less_than"
      threshold: 10  # 每分钟请求数骤降
      duration_seconds: 180
      level: "warning"
      message: "Request rate dropped significantly: {{value}} req/min"
      channels:
        - "webhook"
        - "log"

  # Alert aggregation
  aggregation:
    enabled: true
    window_seconds: 300
    max_alerts_per_window: 10
    
  # Alert suppression
  suppression:
    enabled: true
    maintenance_windows:
      - start: "02:00"
        end: "04:00"
        timezone: "Asia/Shanghai"
        days:
          - sunday

# API configuration
api:
  host: "0.0.0.0"
  port: 8080
  workers: 4
  
  # CORS settings
  cors:
    enabled: true
    origins:
      - "https://7zi.com"
      - "https://dashboard.7zi.com"
      
  # Authentication
  auth:
    enabled: true
    type: "api_key"  # api_key, jwt
    api_keys:
      - name: "dashboard"
        key: "${API_KEY_DASHBOARD}"
      - name: "internal"
        key: "${API_KEY_INTERNAL}"
        
  # Rate limiting
  rate_limit:
    enabled: true
    requests_per_minute: 100
    burst: 20

# WebSocket configuration
websocket:
  enabled: true
  path: "/ws"
  heartbeat_seconds: 30
  max_connections: 100

# Report generation
reports:
  enabled: true
  schedule:
    - type: "daily"
      time: "08:00"
      timezone: "Asia/Shanghai"
    - type: "weekly"
      time: "09:00"
      day: "monday"
      timezone: "Asia/Shanghai"
  output_dir: "/var/lib/7zi-monitoring/reports"

# Volcengine integration
volcengine:
  access_key: "${VOLCENGINE_ACCESS_KEY}"
  secret_key: "${VOLCENGINE_SECRET_KEY}"
  region: "cn-beijing"
  
  # Auto-scaling service
  scaling:
    instance_group_id: "${VOLCENGINE_INSTANCE_GROUP_ID}"
    instance_type: "ecs.g1.large"
    image_id: "${VOLCENGINE_IMAGE_ID}"
    
  # Monitoring
  monitoring:
    namespace: "7zi"
    metric_prefix: "7zi"
