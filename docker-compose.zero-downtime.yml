# ============================================
# 7zi-frontend Docker Compose (零停机部署)
# 版本: 2.0 - 支持蓝绿部署和滚动更新
# ============================================

version: '3.8'

# ============================================
# 服务定义
# ============================================
services:
  # ==========================================
  # Blue 实例（当前活跃版本）
  # ==========================================
  7zi-frontend-blue:
    build:
      context: .
      dockerfile: Dockerfile.optimized
      target: runner-alpine
      args:
        - NODE_ENV=production
    image: 7zi-frontend:blue-${VERSION:-latest}
    container_name: 7zi-frontend-blue
    hostname: 7zi-blue

    # 不暴露到主机，通过 nginx 代理
    expose:
      - '3000'

    env_file:
      - .env.production

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - DEPLOYMENT_SLOT=blue

    # 健康检查
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # 日志配置
    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
        labels: 'service,environment,slot'
        tag: '{{.Name}}/{{.ID}}'

    # 安全配置
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1777

    networks:
      - 7zi-internal

    labels:
      - 'com.7zi.deployment.slot=blue'
      - 'com.7zi.service=frontend'

  # ==========================================
  # Green 实例（新版本部署时使用）
  # ==========================================
  7zi-frontend-green:
    build:
      context: .
      dockerfile: Dockerfile.optimized
      target: runner-alpine
      args:
        - NODE_ENV=production
    image: 7zi-frontend:green-${VERSION:-latest}
    container_name: 7zi-frontend-green
    hostname: 7zi-green

    expose:
      - '3000'

    env_file:
      - .env.production

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - DEPLOYMENT_SLOT=green

    # 默认不启动，部署时激活
    profiles:
      - green

    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})",
        ]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s

    deploy:
      resources:
        limits:
          cpus: '1.5'
          memory: 768M
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'
        labels: 'service,environment,slot'
        tag: '{{.Name}}/{{.ID}}'

    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:size=10M,mode=1777

    networks:
      - 7zi-internal

    labels:
      - 'com.7zi.deployment.slot=green'
      - 'com.7zi.service=frontend'

  # ==========================================
  # Nginx 反向代理（负载均衡）
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: 7zi-nginx
    restart: unless-stopped

    ports:
      - '80:80'
      - '443:443'

    volumes:
      - ./nginx/nginx-zero-downtime.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - /etc/letsencrypt:/etc/letsencrypt:ro
      # 动态上游配置（零停机切换）
      - ./nginx/conf.d:/etc/nginx/conf.d:ro

    depends_on:
      7zi-frontend-blue:
        condition: service_healthy

    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 15s
      timeout: 5s
      retries: 3

    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    logging:
      driver: 'json-file'
      options:
        max-size: '20m'
        max-file: '5'

    networks:
      - 7zi-internal
      - 7zi-external

    labels:
      - 'com.7zi.service=nginx'

  # ==========================================
  # 可选：Prometheus 监控
  # ==========================================
  # prometheus:
  #   image: prom/prometheus:latest
  #   container_name: 7zi-prometheus
  #   volumes:
  #     - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
  #     - prometheus-data:/prometheus
  #   command:
  #     - '--config.file=/etc/prometheus/prometheus.yml'
  #     - '--storage.tsdb.path=/prometheus'
  #   ports:
  #     - "9090:9090"
  #   networks:
  #     - 7zi-internal

# ============================================
# 网络配置
# ============================================
networks:
  7zi-internal:
    driver: bridge
    internal: true
    ipam:
      config:
        - subnet: 172.28.0.0/16
  7zi-external:
    driver: bridge

# ============================================
# 数据卷（可选）
# ============================================
volumes:
  prometheus-data:
