# ============================================
# Nginx 负载均衡配置 - 7zi 集群
# ============================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # ============================================
    # 日志格式
    # ============================================
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for" '
                    'upstream_addr=$upstream_addr '
                    'upstream_status=$upstream_status '
                    'upstream_response_time=$upstream_response_time '
                    'request_time=$request_time';

    log_format health '$remote_addr - [$time_local] "$request" $status';

    access_log /var/log/nginx/access.log main;

    # ============================================
    # 性能优化
    # ============================================
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;
    client_max_body_size 20M;
    client_body_buffer_size 128k;
    client_header_timeout 60s;
    client_body_timeout 60s;

    # Gzip 压缩
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml text/javascript
               application/json application/javascript application/xml+rss
               application/rss+xml font/truetype font/opentype
               application/vnd.ms-fontobject image/svg+xml;
    gzip_disable "msie6";

    # ============================================
    # 缓冲区优化
    # ============================================
    proxy_buffering on;
    proxy_buffer_size 4k;
    proxy_buffers 8 4k;
    proxy_busy_buffers_size 8k;
    proxy_temp_file_write_size 8k;

    # ============================================
    # 上游服务器配置 - 应用节点负载均衡
    # ============================================
    upstream 7zi_backend {
        # 负载均衡算法：least_conn（最少连接）
        least_conn;

        # 3个应用节点
        server app1:3000 max_fails=3 fail_timeout=30s weight=1;
        server app2:3000 max_fails=3 fail_timeout=30s weight=1;
        server app3:3000 max_fails=3 fail_timeout=30s weight=1;

        # 保持长连接
        keepalive 64;
        keepalive_requests 100;
        keepalive_timeout 60s;
    }

    # ============================================
    # HTTP 服务器配置
    # ============================================
    server {
        listen 80;
        server_name _;

        # 日志
        access_log /var/log/nginx/80-access.log main;
        error_log /var/log/nginx/80-error.log warn;

        # 根目录
        root /usr/share/nginx/html;
        index index.html;

        # 健康检查端点
        location /health-check {
            access_log off;
            alias /usr/share/nginx/html/health-check.html;
        }

        # 状态监控端点（需要认证）
        location /nginx-status {
            stub_status on;
            access_log off;
            allow 127.0.0.1;
            allow 172.0.0.0/8;
            deny all;
        }

        # Let's Encrypt ACME Challenge
        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
            allow all;
        }

        # ============================================
        # WebSocket 支持
        # ============================================
        location /api/ws {
            proxy_pass http://7zi_backend;
            proxy_http_version 1.1;

            # WebSocket 专用头
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";

            # 标准代理头
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;

            # 缓存禁用
            proxy_cache_bypass $http_upgrade;
            proxy_buffering off;
        }

        # ============================================
        # SSE 支持 (Server-Sent Events)
        # ============================================
        location /api/stream {
            proxy_pass http://7zi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # SSE 需要禁用缓冲
            proxy_buffering off;
            proxy_cache off;

            # 长连接超时
            proxy_connect_timeout 7d;
            proxy_send_timeout 7d;
            proxy_read_timeout 7d;
        }

        # ============================================
        # API 代理
        # ============================================
        location /api/ {
            proxy_pass http://7zi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;

            # 缓存控制
            proxy_cache_bypass $http_upgrade;
        }

        # ============================================
        # 静态资源缓存
        # ============================================
        location /_next/static/ {
            proxy_pass http://7zi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;

            # 长期缓存
            expires 1y;
            add_header Cache-Control "public, immutable";

            access_log off;
        }

        location /static/ {
            proxy_pass http://7zi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;

            # 中期缓存
            expires 30d;
            add_header Cache-Control "public";

            access_log off;
        }

        # ============================================
        # 主要应用路由（SPA 支持）
        # ============================================
        location / {
            proxy_pass http://7zi_backend;
            proxy_http_version 1.1;

            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;

            # 超时设置
            proxy_connect_timeout 60s;
            proxy_send_timeout 60s;
            proxy_read_timeout 60s;
        }

        # ============================================
        # 错误页面
        # ============================================
        error_page 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
            internal;
        }
    }

    # ============================================
    # HTTPS 服务器配置（可选）
    # ============================================
    # server {
    #     listen 443 ssl http2;
    #     server_name your-domain.com;
    #
    #     # SSL 证书
    #     ssl_certificate /etc/nginx/ssl/fullchain.pem;
    #     ssl_certificate_key /etc/nginx/ssl/privkey.pem;
    #
    #     # SSL 优化
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     ssl_prefer_server_ciphers on;
    #     ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    #     ssl_session_cache shared:SSL:10m;
    #     ssl_session_timeout 10m;
    #     ssl_stapling on;
    #     ssl_stapling_verify on;
    #
    #     # HSTS
    #     add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    #
    #     # 其他配置同 HTTP
    #     # ...
    # }
}
