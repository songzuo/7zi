# ============================================
# HAProxy 配置文件
# 用于 7zi 集群负载均衡
# 服务器: 7zi.com (165.99.43.61)
# ============================================

# 全局配置
global
    # 最大连接数
    maxconn 4096

    # 运行用户和组
    user haproxy
    group haproxy

    # 守护进程模式
    daemon

    # 日志配置
    log /dev/log local0 info
    log /dev/log local1 notice

    # 统计页面套接字
    stats socket /run/haproxy/admin.sock mode 660 level admin

    # 默认 SSL 配置
    ssl-default-bind-ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384
    ssl-default-bind-ciphersuites TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256
    ssl-default-bind-options no-sslv3 no-tlsv10 no-tlsv11

# 默认配置
defaults
    # 日志格式
    log global

    # 运行模式
    mode http

    # 选项
    option httplog
    option dontlognull
    option redispatch
    option http-server-close
    option forwardfor except 127.0.0.0/8

    # 超时配置
    timeout connect 5000
    timeout client 50000
    timeout server 50000
    timeout http-keep-alive 60s

    # 错误页面
    errorfile 400 /etc/haproxy/errors/400.http
    errorfile 403 /etc/haproxy/errors/403.http
    errorfile 408 /etc/haproxy/errors/408.http
    errorfile 500 /etc/haproxy/errors/500.http
    errorfile 502 /etc/haproxy/errors/502.http
    errorfile 503 /etc/haproxy/errors/503.http
    errorfile 504 /etc/haproxy/errors/504.http

# ============================================
# 统计页面 (管理界面)
# ============================================
listen stats
    bind *:8080
    mode http
    stats enable
    stats uri /stats
    stats refresh 10s
    stats admin if TRUE
    stats realm HAProxy\ Statistics
    stats auth admin:CHANGE_ME_ADMIN_PASSWORD
    stats show-legends
    stats show-node

# ============================================
# 前端配置 - HTTP (重定向到 HTTPS)
# ============================================
frontend http-in
    bind *:80
    mode http

    # 访问日志
    capture request header Host len 64
    capture request header User-Agent len 128
    capture request header Referer len 256

    # ACME 验证 (Let's Encrypt)
    acl letsencrypt path_beg /.well-known/acme-challenge/
    use_backend letsencrypt if letsencrypt

    # 重定向到 HTTPS
    redirect scheme https if !letsencrypt

# ============================================
# 前端配置 - HTTPS
# ============================================
frontend https-in
    bind *:443 ssl crt /etc/ssl/certs/7zi.com.pem alpn h2,http/1.1
    mode http

    # HTTP/2 支持
    option http-use-htx

    # 访问日志
    capture request header Host len 64
    capture request header User-Agent len 128
    capture request header Referer len 256

    # 健康检查端点
    acl is_healthcheck path /health
    use_backend healthcheck if is_healthcheck

    # 静态资源 (Next.js /_next/*)
    acl is_static path_beg /_next/ /static/ /images/ /favicon.ico
    use_backend web_servers if is_static

    # API 请求
    acl is_api path_beg /api/
    use_backend api_servers if is_api

    # WebSocket (Socket.IO)
    acl is_websocket path_beg /socket.io/ /ws/
    use_backend websocket_servers if is_websocket

    # 默认后端
    default_backend web_servers

# ============================================
# 后端配置 - ACME (Let's Encrypt)
# ============================================
backend letsencrypt
    mode http
    server letsencrypt 127.0.0.1:8081

# ============================================
# 后端配置 - 健康检查
# ============================================
backend healthcheck
    mode http
    http-check expect status 200
    default-server inter 3s rise 2 fall 3

    # 健康检查端点
    server health 127.0.0.1:3000 check

# ============================================
# 后端配置 - Web 服务器 (Next.js)
# ============================================
backend web_servers
    mode http
    balance roundrobin

    # 健康检查
    option httpchk GET /api/health
    http-check expect status 200

    # 后端服务器
    server web-01 182.43.36.134:3000 check inter 3s rise 2 fall 3 weight 100
    # server web-02 <SERVER-3-IP>:3000 check inter 3s rise 2 fall 3 weight 100

    # 会话保持 (可选)
    # cookie SERVERID insert indirect nocache

    # 连接保持
    option http-keep-alive

# ============================================
# 后端配置 - API 服务器 (OpenClaw Gateway)
# ============================================
backend api_servers
    mode http
    balance leastconn

    # 健康检查
    option httpchk GET /health
    http-check expect status 200

    # 后端服务器 (待配置)
    # server gw-01 <GW-01-IP>:3000 check inter 3s rise 2 fall 3
    # server gw-02 <GW-02-IP>:3000 check inter 3s rise 2 fall 3

    # 连接超时 (API 可能较慢)
    timeout server 60000

# ============================================
# 后端配置 - WebSocket (Socket.IO)
# ============================================
backend websocket_servers
    mode http
    balance roundrobin

    # WebSocket 升级
    option http-buffer-request

    # 后端服务器 (API 网关同时提供 WebSocket)
    # server ws-01 <GW-01-IP>:3000 check inter 3s rise 2 fall 3
    # server ws-02 <GW-02-IP>:3000 check inter 3s rise 2 fall 3

    # 长连接超时
    timeout tunnel 1h

# ============================================
# 监听配置 - 管理 API
# ============================================
listen admin
    bind 127.0.0.1:8404
    mode http
    stats enable
    stats uri /
    stats refresh 10s
    stats show-legends

# ============================================
# 监听配置 - 状态检查 (外部)
# ============================================
listen status
    bind *:9090
    mode http
    http-check expect status 200
    default-server inter 5s rise 1 fall 1

    server status 127.0.0.1:3000 check

# ============================================
# 前端配置 - IPv6 (可选)
# ============================================
frontend http-in-ipv6
    bind [::]:80
    mode http
    default_backend web_servers

# ============================================
# 后端配置 - 文件上传 (大文件支持)
# ============================================
backend upload_servers
    mode http
    balance roundrobin

    # 大文件上传超时
    timeout connect 30s
    timeout client 300s
    timeout server 300s

    # 限制最大请求大小 (100MB)
    option http-buffer-request
    http-request set-header X-Forwarded-Proto https if { ssl_fc }

    # 后端服务器
    server web-01 182.43.36.134:3000

# ============================================
# 前端配置 - 限流 (DDoS 防护)
# ============================================
frontend rate-limit
    bind *:80
    mode http

    # 基于 IP 的限流表
    table ip_table type ip size 100k expire 30s store http_req_rate

    # 限流规则: 每秒 100 请求
    http-request deny deny_status 429 if { src,ip_table,http_req_rate gt 100 }

    # 记录限流日志
    http-request track-sc0 src table ip_table

    default_backend web_servers
