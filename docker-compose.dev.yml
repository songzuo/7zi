# ============================================
# 7zi-frontend Docker Compose (本地开发)
# 支持热重载、调试、本地开发环境
# ============================================

version: '3.8'

services:
  # Next.js 开发服务器
  frontend-dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: 7zi-frontend-dev
    restart: unless-stopped

    ports:
      - '${PORT:-3000}:3000'

    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # Turbopack 开发模式（更快的 HMR）
      - TURBOPACK=1
      # 统计服务
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
      - NEXT_PUBLIC_UMAMI_ID=${NEXT_PUBLIC_UMAMI_ID:-}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-https://analytics.umami.is}
      - NEXT_PUBLIC_PLAUSIBLE_ID=${NEXT_PUBLIC_PLAUSIBLE_ID:-}
      - NEXT_PUBLIC_BAIDU_ID=${NEXT_PUBLIC_BAIDU_ID:-}
      # 邮件服务
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-business@7zi.studio}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@7zi.studio}

    volumes:
      # 挂载源代码以支持热重载
      - .:/app
      - /app/node_modules
      - /app/.next

    # 开发环境不需要资源限制
    # 但可以设置合理的限制以避免占用过多资源
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    # 日志配置
    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - 7zi-network

  # Nginx (可选 - 用于测试生产配置)
  nginx-dev:
    image: nginx:alpine
    container_name: 7zi-nginx-dev
    restart: unless-stopped

    ports:
      - '8080:80'
      - '8443:443'

    volumes:
      - ./nginx/nginx-optimized.conf:/etc/nginx/conf.d/default.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - nginx-cache:/var/cache/nginx

    depends_on:
      - frontend-dev

    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    logging:
      driver: 'json-file'
      options:
        max-size: '10m'
        max-file: '3'

    networks:
      - 7zi-network

  # Redis (可选 - 用于开发环境测试)
  redis-dev:
    image: redis:7-alpine
    container_name: 7zi-redis-dev
    restart: unless-stopped

    ports:
      - '${REDIS_PORT:-6379}:6379'

    volumes:
      - redis-data:/data

    command: redis-server --appendonly yes

    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 10s
      timeout: 3s
      retries: 3

    networks:
      - 7zi-network

networks:
  7zi-network:
    driver: bridge

volumes:
  redis-data:
    driver: local
  nginx-cache:
    driver: local
