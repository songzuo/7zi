# ============================================
# OpenClaw v1.11.0 Kubernetes Service
# ============================================

# 主服务 - ClusterIP
apiVersion: v1
kind: Service
metadata:
  name: openclaw
  namespace: openclaw
  labels:
    app: openclaw
    tier: frontend
spec:
  type: ClusterIP
  selector:
    app: openclaw
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
  # 会话亲和性（可选）
  sessionAffinity: None

---
# NodePort 服务（可选，用于外部访问）
apiVersion: v1
kind: Service
metadata:
  name: openclaw-nodeport
  namespace: openclaw
  labels:
    app: openclaw
    tier: frontend
spec:
  type: NodePort
  selector:
    app: openclaw
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP
      nodePort: 30300  # 30000-32767 范围内

---
# Headless 服务（用于 StatefulSet，可选）
apiVersion: v1
kind: Service
metadata:
  name: openclaw-headless
  namespace: openclaw
  labels:
    app: openclaw
    tier: frontend
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: openclaw
  ports:
    - name: http
      port: 3000
      targetPort: http
      protocol: TCP

---
# Prometheus ServiceMonitor（用于监控）
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: openclaw-monitor
  namespace: openclaw
  labels:
    app: openclaw
    release: prometheus
spec:
  selector:
    matchLabels:
      app: openclaw
  endpoints:
    - port: http
      path: /api/metrics
      interval: 30s
      scrapeTimeout: 10s