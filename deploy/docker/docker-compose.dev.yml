# ============================================
# OpenClaw v1.11.0 Docker Compose - 开发环境
# ============================================

version: '3.8'

services:
  # OpenClaw 主应用
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      target: builder
      args:
        - NODE_ENV=development
    image: openclaw:dev
    container_name: openclaw-dev
    restart: unless-stopped

    ports:
      - '${PORT:-3000}:3000'

    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # 数据库
      - DATABASE_URL=file:./data/openclaw.db
      # Redis
      - REDIS_URL=redis://redis:6379
      # 日志级别
      - LOG_LEVEL=debug
      # 功能开关
      - ENABLE_ANALYTICS=false
      - ENABLE_SENTRY=false

    volumes:
      # 挂载源代码（热重载）
      - ../../src:/app/src:ro
      - ../../public:/app/public:ro
      # 数据持久化
      - openclaw-data:/app/data
      - openclaw-logs:/app/logs
      - openclaw-uploads:/app/uploads

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # 健康检查
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

    networks:
      - openclaw-network

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: openclaw-postgres-dev
    restart: unless-stopped

    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    environment:
      - POSTGRES_USER=${POSTGRES_USER:-openclaw}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-openclaw_dev}
      - POSTGRES_DB=${POSTGRES_DB:-openclaw_dev}
      - PGDATA=/var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data

    # 健康检查
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-openclaw}']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - openclaw-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: openclaw-redis-dev
    restart: unless-stopped

    ports:
      - '${REDIS_PORT:-6379}:6379'

    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-redis_dev}

    volumes:
      - redis-data:/data

    # 健康检查
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    networks:
      - openclaw-network

  # pgAdmin（数据库管理工具）
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: openclaw-pgadmin-dev
    restart: unless-stopped

    ports:
      - '${PGADMIN_PORT:-5050}:80'

    environment:
      - PGADMIN_DEFAULT_EMAIL=${PGADMIN_EMAIL:-admin@openclaw.dev}
      - PGADMIN_DEFAULT_PASSWORD=${PGADMIN_PASSWORD:-admin}
      - PGADMIN_CONFIG_SERVER_MODE=False

    volumes:
      - pgadmin-data:/var/lib/pgadmin

    depends_on:
      postgres:
        condition: service_healthy

    networks:
      - openclaw-network

  # Redis Commander（Redis 管理工具）
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: openclaw-redis-commander-dev
    restart: unless-stopped

    ports:
      - '${REDIS_COMMANDER_PORT:-8081}:8081'

    environment:
      - REDIS_HOSTS=local:redis:6379:0:${REDIS_PASSWORD:-redis_dev}

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - openclaw-network

volumes:
  openclaw-data:
    driver: local
  openclaw-logs:
    driver: local
  openclaw-uploads:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  pgadmin-data:
    driver: local

networks:
  openclaw-network:
    driver: bridge