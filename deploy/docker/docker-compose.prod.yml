# ============================================
# OpenClaw v1.11.0 Docker Compose - 生产环境
# ============================================

version: '3.8'

services:
  # OpenClaw 主应用
  openclaw:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile
      args:
        - NODE_ENV=production
        - VERSION=v1.11.0
        - BUILD_DATE=${BUILD_DATE:-}
        - GIT_COMMIT=${GIT_COMMIT:-}
    image: openclaw:${VERSION:-latest}
    container_name: openclaw-prod
    restart: always

    ports:
      - '${PORT:-3000}:3000'

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      # 数据库
      - DATABASE_URL=${DATABASE_URL}
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      # Redis
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      # 安全
      - JWT_SECRET=${JWT_SECRET}
      - SESSION_SECRET=${SESSION_SECRET}
      - ENCRYPTION_KEY=${ENCRYPTION_KEY}
      # 监控
      - SENTRY_DSN=${SENTRY_DSN}
      - SENTRY_ENVIRONMENT=production
      # 功能开关
      - ENABLE_ANALYTICS=${ENABLE_ANALYTICS:-true}
      - ENABLE_SENTRY=${ENABLE_SENTRY:-true}
      # 日志
      - LOG_LEVEL=${LOG_LEVEL:-info}

    volumes:
      - openclaw-data:/app/data
      - openclaw-logs:/app/logs
      - openclaw-uploads:/app/uploads

    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_healthy

    # 健康检查
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/api/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # 日志配置
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        compress: 'true'

    networks:
      - openclaw-network

  # PostgreSQL 数据库
  postgres:
    image: postgres:16-alpine
    container_name: openclaw-postgres-prod
    restart: always

    ports:
      - '${POSTGRES_PORT:-5432}:5432'

    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
      - PGDATA=/var/lib/postgresql/data/pgdata

    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro

    # 健康检查
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER}']
      interval: 10s
      timeout: 5s
      retries: 5

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    # 日志配置
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        compress: 'true'

    networks:
      - openclaw-network

  # Redis 缓存
  redis:
    image: redis:7-alpine
    container_name: openclaw-redis-prod
    restart: always

    ports:
      - '${REDIS_PORT:-6379}:6379'

    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
      --save 60 10000

    volumes:
      - redis-data:/data

    # 健康检查
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    # 日志配置
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        compress: 'true'

    networks:
      - openclaw-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: openclaw-nginx-prod
    restart: always

    ports:
      - '80:80'
      - '443:443'

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx
      - openclaw-uploads:/var/www/uploads:ro

    depends_on:
      openclaw:
        condition: service_healthy

    # 健康检查
    healthcheck:
      test: ['CMD', 'wget', '--no-verbose', '--tries=1', '--spider', 'http://localhost/health']
      interval: 30s
      timeout: 10s
      retries: 3

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
        reservations:
          cpus: '0.1'
          memory: 64M

    # 日志配置
    logging:
      driver: 'json-file'
      options:
        max-size: '50m'
        max-file: '5'
        compress: 'true'

    networks:
      - openclaw-network

  # Prometheus（监控）
  prometheus:
    image: prom/prometheus:latest
    container_name: openclaw-prometheus-prod
    restart: always

    ports:
      - '${PROMETHEUS_PORT:-9090}:9090'

    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus

    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
      - '--storage.tsdb.retention.time=30d'

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M

    networks:
      - openclaw-network

  # Grafana（可视化）
  grafana:
    image: grafana/grafana:latest
    container_name: openclaw-grafana-prod
    restart: always

    ports:
      - '${GRAFANA_PORT:-3001}:3000'

    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD}
      - GF_INSTALL_PLUGINS=redis-datasource

    volumes:
      - grafana-data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro

    depends_on:
      - prometheus

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M

    networks:
      - openclaw-network

volumes:
  openclaw-data:
    driver: local
  openclaw-logs:
    driver: local
  openclaw-uploads:
    driver: local
  postgres-data:
    driver: local
  redis-data:
    driver: local
  prometheus-data:
    driver: local
  grafana-data:
    driver: local

networks:
  openclaw-network:
    driver: bridge