# ==========================================================================
# pnpm-workspace.yaml —— pnpm 12 运行期配置
#
# 背景（2026-10-26 事故二）：
#   pnpm 12 起不再读取 package.json 中的 `pnpm` 字段，配置统一迁到
#   pnpm-workspace.yaml。两处必须迁移，否则部署期直接失败：
#
#   1) overrides —— 原 package.json 的 pnpm.overrides（brace-expansion /
#      flatted / serialize-javascript 的安全版本下限）会被静默忽略，
#      WARN 提示 "The pnpm field in package.json is no longer read"。
#
#   2) allowBuilds —— pnpm 12 把「依赖的构建脚本未被批准」从 warning
#      升级为 **error**（ERR_PNPM_IGNORED_BUILDS），install 直接失败。
#      未批准列表中的包（@swc/core、better-sqlite3、sharp、unrs-resolver 等）
#      需要编译/下载原生产物，必须显式批准。
#
# 本文件必须随代码一起入库（git archive 会覆盖部署目录），
# 否则 hook 解包后配置丢失，pnpm install 必然报 ERR_PNPM_IGNORED_BUILDS。
# ==========================================================================

overrides:
  brace-expansion@>=4.0.0 <5.0.5: '>=5.0.5'
  flatted@<=3.4.1: '>=3.4.2'
  serialize-javascript: '>=7.0.5'

# 允许执行构建脚本（install 阶段）的依赖白名单
allowBuilds:
  '@parcel/watcher': true
  '@sentry/cli': true
  '@swc/core': true
  better-sqlite3: true
  core-js: true
  msw: true
  sharp: true
  unrs-resolver: true
