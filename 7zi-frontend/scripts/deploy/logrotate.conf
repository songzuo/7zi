# ============================================
# Logrotate 配置 - SSL 证书续期日志
# ============================================
# 路径: /etc/logrotate.d/ssl-renew
# 或项目内: scripts/deploy/logrotate.conf
# ============================================

# 日志文件路径 (根据实际安装调整)
# /var/log/ssl-renew.log

# 轮转频率: 每日
daily

# 忽略缺失的日志文件
missingok

# 保留 14 天的日志
rotate 14

# 压缩旧日志
compress

# 延迟压缩 (昨天的日志今天压缩)
delaycompress

# 空日志不轮转
notifempty

# 创建新日志文件权限
create 0644 root root

# 共享脚本 (只执行一次 postrotate)
sharedscripts

# 轮转后执行的脚本
postrotate
    # 通知 Nginx 重新打开日志
    if [ -f /var/run/nginx.pid ]; then
        kill -USR1 $(cat /var/run/nginx.pid) 2>/dev/null || true
    fi
endscript

# 轮转前执行的脚本
prerotate
    # 可选: 发送旧日志到远程服务器
    # scp /var/log/ssl-renew.log.* backup@remote:/backup/logs/ 2>/dev/null || true
    :
endscript
