version: '3.8'

services:
  app:
    image: 7zi-frontend:prod-v3
    container_name: 7zi-frontend-prod
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_TELEMETRY_DISABLED=1
    deploy:
      resources:
        limits:
          memory: 1024M  # ✅ 增加到 1GB
        reservations:
          memory: 512M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp:noexec,nosuid,size=100m
    networks:
      - app-network
    # 如果使用外部 secrets（推荐生产环境）
    # secrets:
    #   - jwt_secret
    #   - database_url

networks:
  app-network:
    driver: bridge

# 生产环境推荐使用 Docker Secrets
# secrets:
#   jwt_secret:
#     file: ./secrets/jwt_secret.txt
#   database_url:
#     file: ./secrets/database_url.txt
