name: E2E Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      browsers:
        description: 'Browsers to test'
        required: false
        default: 'chromium'
        type: choice
        options:
          - chromium
          - firefox
          - webkit
          - all

permissions:
  contents: read
  packages: read
  statuses: read
  pull-requests: write
  actions: read
  pages: write

env:
  NODE_VERSION: '20.x'

jobs:
  # ============================================
  # 准备依赖缓存
  # ============================================
  prepare:
    name: 🔧 Prepare
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-key.outputs.value }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate cache key
        id: cache-key
        run: echo "value=node-${{ hashFiles('package-lock.json') }}" >> $GITHUB_OUTPUT

  # ============================================
  # E2E 测试 - Chromium
  # ============================================
  test-chromium:
    name: 🎭 E2E (Chromium)
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event.inputs.browsers == 'all' || github.event.inputs.browsers == '' || github.event.inputs.browsers == 'chromium'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-
            playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests (Chromium)
        run: npm run test:e2e -- --project=chromium
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-chromium
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # E2E 测试 - Firefox
  # ============================================
  test-firefox:
    name: 🎭 E2E (Firefox)
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event.inputs.browsers == 'all' || github.event.inputs.browsers == 'firefox'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-firefox-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-firefox-
            playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps firefox

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps firefox

      - name: Run E2E tests (Firefox)
        run: npm run test:e2e -- --project=firefox
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-firefox
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # E2E 测试 - WebKit
  # ============================================
  test-webkit:
    name: 🎭 E2E (WebKit)
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event.inputs.browsers == 'all' || github.event.inputs.browsers == 'webkit'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-webkit-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-webkit-
            playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps webkit

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps webkit

      - name: Run E2E tests (WebKit)
        run: npm run test:e2e -- --project=webkit
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-webkit
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # E2E 测试 - Mobile
  # ============================================
  test-mobile:
    name: 🎭 E2E (Mobile)
    runs-on: ubuntu-latest
    needs: prepare
    if: github.event.inputs.browsers == 'all'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Restore Playwright browser cache
        uses: actions/cache@v4
        id: playwright-cache
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            playwright-chromium-
            playwright-

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright browser dependencies
        if: steps.playwright-cache.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run E2E tests (Mobile Chrome)
        run: npm run test:e2e -- --project="Mobile Chrome"

      - name: Run E2E tests (Mobile Safari)
        run: npm run test:e2e -- --project="Mobile Safari"

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results-mobile
          path: |
            test-results/
            playwright-report/
          retention-days: 7

  # ============================================
  # 合并测试报告
  # ============================================
  merge-reports:
    name: 📊 Merge Reports
    runs-on: ubuntu-latest
    needs: [test-chromium, test-firefox, test-webkit, test-mobile]
    if: always()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-reports

      - name: Merge HTML reports
        run: npx playwright merge-reports --reporter html all-reports

      - name: Upload merged report
        uses: actions/upload-artifact@v4
        with:
          name: merged-playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Deploy to GitHub Pages
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./playwright-report
          destination_dir: e2e-reports/${{ github.sha }}
