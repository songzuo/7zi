name: CI (Optimized for v1.5.0)

on:
  push:
    branches: [main, develop, 'release/**']
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  packages: read
  statuses: read
  pull-requests: write
  actions: read
  security-events: write

env:
  NODE_VERSION: '20.x'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ============================================
  # 代码质量检查（缓存优化）
  # ============================================
  lint:
    name: 🔍 Lint & Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 缓存 node_modules - 使用多个 key 增强命中率
      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript check
        run: npx tsc --noEmit

  # ============================================
  # 单元测试（并行化）
  # ============================================
  test-unit:
    name: 🧪 Unit Tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run unit tests
        run: npm run test:ci

      - name: Upload coverage reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: coverage/
          retention-days: 7
          compression-level: 6

  # ============================================
  # 构建优化（使用 Turbopack + 缓存）
  # ============================================
  build:
    name: 🏗️ Build Production
    runs-on: ubuntu-latest
    needs: [lint, test-unit]
    timeout-minutes: 10
    outputs:
      build-size: ${{ steps.measure.outputs.size }}
      build-time: ${{ steps.measure.outputs.time }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # 缓存 Next.js .next 目录（增量构建）
      - name: Cache Next.js build
        uses: actions/cache@v4
        id: cache-nextjs
        with:
          path: |
            .next
            .next/cache
          key: ${{ runner.os }}-nextjs-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-nextjs-

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      # 使用 Turbopack 加速构建
      - name: Build with Turbopack
        run: |
          START_TIME=$(date +%s)
          npm run build
          END_TIME=$(date +%s)
          echo "time=$((END_TIME - START_TIME))" >> $GITHUB_OUTPUT
        env:
          NODE_ENV: production
          NEXT_TELEMETRY_DISABLED: 1
          TURBOPACK_ENABLED: 1
        id: build

      - name: Measure build size
        run: |
          SIZE=$(du -sh .next | cut -f1)
          echo "size=$SIZE" >> $GITHUB_OUTPUT
        id: measure

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-output
          path: |
            .next/
            public/
          retention-days: 7
          compression-level: 6

  # ============================================
  # 并行任务矩阵：安全扫描 + 依赖检查
  # ============================================
  parallel-checks:
    name: 📋 ${{ matrix.name }}
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: Security Audit
            command: npm audit --audit-level=moderate
            continue-on-error: true
          - name: Dependency Check
            command: npx npm-check-updates --checkVersion
            continue-on-error: true
          - name: License Check
            command: npx license-checker --production --onlyAllow "MIT;Apache-2.0;BSD-3-Clause;ISC"
            continue-on-error: true
    timeout-minutes: 3
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run ${{ matrix.name }}
        run: ${{ matrix.command }}
        continue-on-error: ${{ matrix.continue-on-error }}

  # ============================================
  # E2E 测试（条件执行）
  # ============================================
  test-e2e:
    name: 🎭 E2E Tests
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' || github.event_name == 'pull_request'
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Install Playwright browsers (cached)
        uses: manuelmauro/playwright-cache-action@v1

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          BASE_URL: http://localhost:3000

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-results
          path: |
            playwright-report/
            test-results/
          retention-days: 7
          compression-level: 6

  # ============================================
  # 性能基准测试
  # ============================================
  benchmark:
    name: 📊 Performance Benchmark
    runs-on: ubuntu-latest
    needs: [build]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js with Cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            http://localhost:3000
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ============================================
  # 总结报告
  # ============================================
  summary:
    name: 📋 CI Summary
    runs-on: ubuntu-latest
    needs: [lint, test-unit, build, parallel-checks, test-e2e, benchmark]
    if: always()
    timeout-minutes: 2
    steps:
      - name: Generate Summary
        run: |
          echo "## 🎯 CI Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status | Duration |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|----------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lint | ${{ needs.lint.result == 'success' && '✅' || '❌' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-unit.result == 'success' && '✅' || '❌' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result == 'success' && '✅' || '❌' }} | ${{ needs.build.outputs.build-time }}s |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Size | ${{ needs.build.result == 'success' && '✅' || '❌' }} | ${{ needs.build.outputs.build-size }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Parallel Checks | ${{ needs.parallel-checks.result == 'success' && '✅' || '❌' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.test-e2e.result == 'success' && '✅' || '⏭️' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "| Benchmark | ${{ needs.benchmark.result == 'success' && '✅' || '⏭️' }} | - |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Overall:** ${{ needs.summary.result == 'success' && '✅ All checks passed!' || '⚠️ Some checks failed' }}" >> $GITHUB_STEP_SUMMARY
