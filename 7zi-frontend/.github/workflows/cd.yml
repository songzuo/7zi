name: CD

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  statuses: read
  actions: read
  security-events: write

env:
  NODE_VERSION: '20.x'
  REGISTRY: ghcr.io
  IMAGE_NAME: 7zi-frontend

jobs:
  # ============================================
  # 构建并推送 Docker 镜像
  # ============================================
  build-and-push:
    name: 🐳 Build & Push Docker Image
    runs-on: ubuntu-latest
    outputs:
      image-tag: ${{ steps.meta.outputs.tags }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:ci

      - name: Build Next.js app
        run: npm run build
        env:
          NODE_ENV: production

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ github.repository }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix={{branch}}-
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push Docker image
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NODE_ENV=production

  # ============================================
  # 部署到生产环境
  # ============================================
  deploy-production:
    name: 🚀 Deploy to Production
    runs-on: ubuntu-latest
    needs: build-and-push
    environment:
      name: production
      url: https://7zi.com
      prevent_multi_deployment: true
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Pull and restart application
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          ssh root@${{ env.PRODUCTION_HOST }} << 'ENDSSH'
            # Pull latest image
            docker pull ${{ needs.build-and-push.outputs.image-tag }}

            # Stop old container
            docker stop 7zi-frontend || true
            docker rm 7zi-frontend || true

            # Start new container
            docker run -d \
              --name 7zi-frontend \
              --restart unless-stopped \
              -p 3000:3000 \
              --env-file /root/.env.production \
              ${{ needs.build-and-push.outputs.image-tag }}

            # Cleanup old images
            docker image prune -af
          ENDSSH

      - name: Health check
        run: |
          max_attempts=30
          attempt=1

          while [ $attempt -le $max_attempts ]; do
            if curl -f https://7zi.com/api/health > /dev/null 2>&1; then
              echo "✅ Health check passed!"
              exit 0
            fi

            echo "Attempt $attempt/$max_attempts failed. Retrying in 10 seconds..."
            sleep 10
            ((attempt++))
          done

          echo "❌ Health check failed after $max_attempts attempts"
          exit 1

      - name: Notify deployment success
        if: success()
        run: |
          echo "🎉 Deployment to production successful!"
          echo "Image: ${{ needs.build-and-push.outputs.image-tag }}"

      - name: Notify deployment failure
        if: failure()
        run: |
          echo "❌ Deployment to production failed!"
          echo "Please check the logs and investigate."

  # ============================================
  # 部署后验证测试
  # ============================================
  post-deploy-tests:
    name: 🧪 Post-Deploy Tests
    runs-on: ubuntu-latest
    needs: deploy-production
    if: success()
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run smoke tests against production
        run: npx playwright test --grep @smoke
        env:
          BASE_URL: https://7zi.com

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v10
        with:
          urls: |
            https://7zi.com
          uploadArtifacts: true
          temporaryPublicStorage: true

  # ============================================
  # 回滚 (失败时)
  # ============================================
  rollback:
    name: ↩️ Auto Rollback
    runs-on: ubuntu-latest
    needs: [deploy-production, post-deploy-tests]
    if: failure()
    environment:
      name: production
    steps:
      - name: Install SSH key
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Execute automatic rollback
        env:
          PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}
        run: |
          echo "⚠️ Deployment failed! Initiating automatic rollback..."
          ssh root@${{ env.PRODUCTION_HOST }} << 'ENDSSH'
            # Get previous image tag (from docker images list)
            PREV_IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -v latest | head -1)
            
            if [ -z "$PREV_IMAGE" ]; then
              echo "No previous image found. Using current container if exists."
              docker start 7zi-frontend || true
            else
              echo "Rolling back to: $PREV_IMAGE"
              docker stop 7zi-frontend || true
              docker rm 7zi-frontend || true
              docker run -d \
                --name 7zi-frontend \
                --restart unless-stopped \
                -p 3000:3000 \
                --env-file /root/.env.production \
                $PREV_IMAGE
            fi
          ENDSSH
          echo "✅ Rollback completed"
