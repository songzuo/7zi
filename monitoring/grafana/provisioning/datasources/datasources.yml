# Grafana Datasources Configuration for 7zi Platform v1.9.1 (Loki 已停)
# Updated: 2026-09-21

apiVersion: 1

datasources:
  # Prometheus 数据源
  - name: Prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true
    editable: false
    jsonData:
      timeInterval: "15s"
      httpMethod: POST
      manageAlerts: true
      prometheusType: Prometheus
      prometheusVersion: "2.48.0"
    version: 1

  # Loki 数据源已移除（2026-09-21 7zi-loki 已停）
  # 如需恢复：原 datasources.yml.bak 已在 /root/b6_backup/nginx-20260921/
