# Prometheus Configuration for 7zi Platform v1.9.4
# Updated: 2026-04-13
# Changes: Removed broken 7zi-frontend (no prom metrics), use nginx health instead

global:
  scrape_interval: 15s
  scrape_timeout: 10s
  evaluation_interval: 15s
  external_labels:
    environment: production
    service: 7zi-platform
    version: 1.9.4

alerting:
  alertmanagers:
    - static_configs:
        - targets:
            - alertmanager:9093
      scheme: http
      timeout: 10s
      api_version: v2

rule_files:
  - /etc/prometheus/rules/*.yml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: [localhost:9090]

  - job_name: docker-stack
    static_configs:
      - targets: [node-exporter:9100, cadvisor:8080, pushgateway:9091]
        labels:
          group: docker
      - targets: [health-service:8085]
        labels:
          group: health
    scrape_interval: 30s

  - job_name: loki
    static_configs:
      - targets: [loki:3100]

  - job_name: servers
    scrape_interval: 30s
    static_configs:
      - targets:
          - 8.215.23.144:9101
          - 47.81.39.226:9101
          - 43.159.49.231:9101
          - 182.43.36.134:9101
          - 165.99.43.61:9101
        labels:
          group: servers

  - job_name: 7zi-health
    scrape_interval: 60s
    static_configs:
      - targets: [165.99.43.61:3000]
        labels:
          service: frontend
          app: 7zi
    metrics_path: /api/health

