# AlertManager Configuration for 7zi Platform v1.9.1
# Updated: 2026-04-03

global:
  resolve_timeout: 5m
  smtp_smarthost: 'smtp.gmail.com:587'
  smtp_from: '7zi-alert@7zi.com'
  smtp_auth_username: '7zi-alert@7zi.com'
  smtp_auth_password: '${SMTP_PASSWORD}'
  slack_api_url: '${SLACK_WEBHOOK_URL}'
  telegram_api_url: 'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage'

# 告警路由配置
route:
  group_by: ['alertname', 'severity', 'service']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h
  receiver: 'default-receiver'
  # 告警抑制配置
  inhibit_rules:
    # 严重告警抑制警告告警
    - source_match:
        severity: 'critical'
      target_match:
        severity: 'warning'
      equal: ['alertname', 'instance']

    # 服务宕机时抑制相关告警
    - source_match:
        alertname: 'ServiceDown'
      target_match_re:
        alertname: '.*'
      equal: ['instance']

    # 容器宕机时抑制容器相关告警
    - source_match:
        alertname: 'ContainerNotRunning'
      target_match:
        category: 'container'
      equal: ['name']

# 接收者配置
receivers:
  # 默认接收者（所有告警）
  - name: 'default-receiver'
    email_configs:
      - to: 'ops@7zi.com'
        send_resolved: true
        html: |
          <h2>7zi 平台告警通知</h2>
          <p><strong>告警名称:</strong> {{ .GroupLabels.alertname }}</p>
          <p><strong>严重程度:</strong> {{ .Labels.severity }}</p>
          <p><strong>实例:</strong> {{ .Labels.instance }}</p>
          <p><strong>描述:</strong> {{ .Annotations.description }}</p>
          <p><a href="{{ .GeneratorURL }}">查看详情</a></p>
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#7zi-alerts'
        send_resolved: true
        title: '7zi 告警: {{ .GroupLabels.alertname }}'
        text: |
          *告警名称:* {{ .GroupLabels.alertname }}
          *严重程度:* {{ .Labels.severity }}
          *实例:* {{ .Labels.instance }}
          *描述:* {{ .Annotations.description }}
          <{{ .GeneratorURL }}|查看详情>
        color: '{{ if eq .Labels.severity "critical" }}danger{{ else if eq .Labels.severity "warning" }}warning{{ else }}good{{ end }}'
    telegram_configs:
      - api_url: 'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage'
        chat_id: '${TELEGRAM_CHAT_ID}'
        parse_mode: 'Markdown'
        send_resolved: true
        message: |
          🚨 *7zi 平台告警*
          
          *告警名称:* {{ .GroupLabels.alertname }}
          *严重程度:* {{ .Labels.severity }}
          *实例:* {{ .Labels.instance }}
          *描述:* {{ .Annotations.description }}

  # 严重告警接收者
  - name: 'critical-receiver'
    email_configs:
      - to: 'critical@7zi.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#7zi-critical'
        send_resolved: true
        title: '🚨 严重告警: {{ .GroupLabels.alertname }}'
        text: |
          *告警名称:* {{ .GroupLabels.alertname }}
          *严重程度:* {{ .Labels.severity }}
          *实例:* {{ .Labels.instance }}
          *描述:* {{ .Annotations.description }}
          <{{ .GeneratorURL }}|立即查看>
        color: 'danger'
    telegram_configs:
      - api_url: 'https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage'
        chat_id: '${TELEGRAM_CRITICAL_CHAT_ID}'
        parse_mode: 'Markdown'
        send_resolved: true
        message: |
          🚨 *严重告警*
          
          *告警名称:* {{ .GroupLabels.alertname }}
          *严重程度:* {{ .Labels.severity }}
          *实例:* {{ .Labels.instance }}
          *描述:* {{ .Annotations.description }}
          *请立即处理！*

  # 系统告警接收者
  - name: 'system-receiver'
    email_configs:
      - to: 'system@7zi.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#7zi-system'
        send_resolved: true
        title: '系统告警: {{ .GroupLabels.alertname }}'
        text: |
          *告警名称:* {{ .GroupLabels.alertname }}
          *实例:* {{ .Labels.instance }}
          *描述:* {{ .Annotations.description }}

  # 应用告警接收者
  - name: 'app-receiver'
    email_configs:
      - to: 'dev@7zi.com'
        send_resolved: true
    slack_configs:
      - api_url: '${SLACK_WEBHOOK_URL}'
        channel: '#7zi-dev'
        send_resolved: true
        title: '应用告警: {{ .GroupLabels.alertname }}'
        text: |
          *告警名称:* {{ .GroupLabels.alertname }}
          *服务:* {{ .Labels.service }}
          *描述:* {{ .Annotations.description }}

# 路由规则 - 根据标签分发告警
route:
  routes:
    # 严重告警
    - match:
        severity: critical
      receiver: critical-receiver
      group_wait: 10s
      repeat_interval: 1h

    # 系统告警
    - match:
        category: system
      receiver: system-receiver
      group_by: ['instance', 'alertname']

    # 网络告警
    - match:
        category: network
      receiver: system-receiver
      group_by: ['instance', 'alertname']

    # 容器告警
    - match:
        category: container
      receiver: system-receiver
      group_by: ['name', 'alertname']

    # 应用告警
    - match:
        category: application
      receiver: app-receiver
      group_by: ['service', 'alertname']

    # 子代理告警
    - match:
        category: subagent
      receiver: app-receiver
      group_by: ['name', 'alertname']

    # 数据库告警
    - match:
        category: database
      receiver: app-receiver
      group_by: ['database', 'alertname']

    # 可用性告警
    - match:
        category: availability
      receiver: critical-receiver
      group_wait: 10s
