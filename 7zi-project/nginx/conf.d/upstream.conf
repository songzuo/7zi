# ============================================
# Nginx 上游配置 - 动态切换（零停机部署）
# 通过修改此文件并 reload nginx 实现蓝绿切换
# ============================================

# 当前活跃的上游（blue 或 green）
# 部署脚本会自动更新此配置

upstream frontend_backend {
    # 蓝绿切换：修改这里
    # Blue（默认）
    server 7zi-frontend-blue:3000;
    # Green（部署时切换到这行）
    # server 7zi-frontend-green:3000;
    
    keepalive 32;
    keepalive_timeout 60s;
    keepalive_requests 1000;
}
