# ============================================
# 7zi-frontend 日志轮转配置
# 路径: /etc/logrotate.d/7zi-frontend
# 安装: sudo cp logrotate.conf /etc/logrotate.d/7zi-frontend
# ============================================

/var/log/7zi-frontend/*.log {
    # 每日轮转
    daily
    
    # 保留 14 天日志
    rotate 14
    
    # 日志文件为空也轮转
    ifempty
    
    # 允许缺失的日志文件
    missingok
    
    # 压缩旧日志
    compress
    delaycompress
    
    # 不报错缺失文件
    nomail
    notifempty
    
    # 创建新日志文件，权限 644，root 用户
    create 0644 root root
    
    # 共享脚本，只执行一次
    sharedscripts
    
    # 轮转后执行的命令
    postrotate
        # 重新打开 PM2 日志文件（不重启应用）
        pm2 reloadLogs 2>/dev/null || true
    endscript
    
    # 使用日期作为扩展名
    dateext
    dateformat -%Y%m%d
    
    # 最小大小限制（小于 1M 不轮转）
    minsize 1M
    
    # 最大大小限制（超过 100M 强制轮转）
    maxsize 100M
}