# ============================================
# 7zi-frontend Docker Compose (本地开发环境)
# 热重载 + 源码挂载 + 开发工具
# ============================================

version: "3.8"

services:
  # Next.js 开发服务器（热重载）
  app:
    image: node:22-alpine
    container_name: 7zi-frontend-dev
    restart: unless-stopped

    working_dir: /app

    # 端口映射（开发环境）
    ports:
      - "${DEV_PORT:-3000}:3000"
      - "${DEV_PORT:-3000}:3000/udp"

    # 源码挂载（热重载）
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
      - /app/.next          # 排除 .next 目录，避免挂载冲突

    # 环境变量（开发）
    environment:
      - NODE_ENV=development
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - WATCHPACK_POLLING=true  # 启用轮询模式（某些环境需要）

      # Next.js 开发优化
      - NEXT_TELEMETRY_DISABLED=1
      - TURBOPACK=1

      # 数据库（SQLite）
      - DATABASE_PATH=/app/data/7zi.db

      # 统计服务（开发环境可留空）
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
      - NEXT_PUBLIC_UMAMI_ID=${NEXT_PUBLIC_UMAMI_ID:-}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-https://analytics.umami.is}
      - NEXT_PUBLIC_PLAUSIBLE_ID=${NEXT_PUBLIC_PLAUSIBLE_ID:-}
      - NEXT_PUBLIC_BAIDU_ID=${NEXT_PUBLIC_BAIDU_ID:-}

      # 邮件服务
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-business@7zi.studio}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@7zi.studio}

      # Sentry（开发环境可禁用）
      - NEXT_PUBLIC_SENTRY_DSN=${NEXT_PUBLIC_SENTRY_DSN:-}
      - SENTRY_ENVIRONMENT=development

    # 启动命令（开发模式 + 热重载）
    command: sh -c "npm install && npm run dev"

    # 健康检查（开发环境）
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s

    # 资源限制（开发环境更宽松）
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # 网络配置
    networks:
      - 7zi-dev-network

  # 数据库管理工具（可选 - SQLite Browser）
  sqlite-browser:
    image: coleifer/sqlite-web:latest
    container_name: 7zi-sqlite-browser
    restart: unless-stopped

    ports:
      - "${SQLITE_BROWSER_PORT:-8080}:8080"

    volumes:
      - ./data:/data

    environment:
      - SQLITE_DB=7zi.db

    depends_on:
      app:
        condition: service_started

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

    networks:
      - 7zi-dev-network

  # 测试运行器（可选 - Vitest UI）
  vitest-ui:
    image: node:22-alpine
    container_name: 7zi-vitest-ui
    restart: "no"  # 手动启动

    working_dir: /app

    ports:
      - "${VITEST_UI_PORT:-51204}:51204"

    volumes:
      - ./:/app
      - node_modules:/app/node_modules

    environment:
      - NODE_ENV=test
      - WATCHPACK_POLLING=true

    # 启动 Vitest UI（手动执行）
    command: sh -c "npm install && npx vitest --ui"

    networks:
      - 7zi-dev-network

    profiles:
      - testing  # 仅在 testing profile 下启动

  # Playwright 测试运行器（可选）
  playwright-tests:
    image: mcr.microsoft.com/playwright:v1.58.2-jammy
    container_name: 7zi-playwright-tests
    restart: "no"  # 手动启动

    working_dir: /app

    volumes:
      - ./:/app
      - node_modules:/app/node_modules

    environment:
      - NODE_ENV=test

    # 启动 E2E 测试（手动执行）
    command: sh -c "npx playwright install && npm run test:e2e"

    depends_on:
      app:
        condition: service_healthy

    networks:
      - 7zi-dev-network

    profiles:
      - testing  # 仅在 testing profile 下启动

# 持久化数据卷
volumes:
  node_modules:  # 隔离 node_modules，避免宿主环境干扰

# 网络配置
networks:
  7zi-dev-network:
    driver: bridge
