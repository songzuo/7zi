# ============================================
# 7zi-frontend Docker Compose (Staging 环境)
# 用于预发布测试
# ============================================

version: "3.8"

services:
  # Next.js Frontend (standalone 模式)
  7zi-frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - NODE_ENV=staging
    image: registry.7zi.com/7zi-frontend:staging
    container_name: 7zi-frontend-staging
    restart: unless-stopped

    ports:
      - "${PORT:-3001}:3000"

    env_file:
      - .env.staging

    environment:
      - NODE_ENV=staging
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1

    # 健康检查
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # 资源限制（Staging 环境）
    deploy:
      resources:
        limits:
          cpus: "1"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "20m"
        max-file: "3"
        labels: "service,environment"
        tag: "{{.Name}}/{{.ID}}"

    # 安全配置
    security_opt:
      - no-new-privileges:true

    networks:
      - 7zi-network

  # Nginx 反向代理
  nginx:
    image: nginx:alpine
    container_name: 7zi-nginx-staging
    restart: unless-stopped

    ports:
      - "8080:80"
      - "8443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - ./nginx/logs:/var/log/nginx

    depends_on:
      7zi-frontend:
        condition: service_healthy

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 32M

    # 日志配置
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - 7zi-network

networks:
  7zi-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.29.0.0/16
