# ============================================
# 7zi-frontend Docker Compose (生产环境 v3.0)
# 资源限制优化 + 健康检查 + Redis 缓存 + 日志轮转
# ============================================
#
# 更新日志:
# - v3.0 (2026-03-29): 添加 Redis 服务，优化资源限制
# - v2.0: 添加健康检查和安全配置
#
# 使用方式:
#   docker-compose -f docker-compose.prod.yml up -d
#
# ============================================

version: "3.8"

services:
  # ============================================
  # Next.js 生产容器（资源优化版）
  # ============================================
  7zi-frontend:
    build:
      context: .
      dockerfile: Dockerfile.production
      cache_from:
        - 7zi-frontend:prod
      args:
        - NODE_ENV=production

    image: 7zi-frontend:prod
    container_name: 7zi-frontend
    restart: always

    ports:
      - "${PORT:-3000}:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NODE_OPTIONS=--max-old-space-size=384
      # 统计服务
      - NEXT_PUBLIC_GA_ID=${NEXT_PUBLIC_GA_ID:-}
      - NEXT_PUBLIC_UMAMI_ID=${NEXT_PUBLIC_UMAMI_ID:-}
      - NEXT_PUBLIC_UMAMI_URL=${NEXT_PUBLIC_UMAMI_URL:-https://analytics.umami.is}
      - NEXT_PUBLIC_PLAUSIBLE_ID=${NEXT_PUBLIC_PLAUSIBLE_ID:-}
      - NEXT_PUBLIC_BAIDU_ID=${NEXT_PUBLIC_BAIDU_ID:-}
      # 邮件服务
      - RESEND_API_KEY=${RESEND_API_KEY}
      - CONTACT_EMAIL=${CONTACT_EMAIL:-business@7zi.studio}
      - FROM_EMAIL=${FROM_EMAIL:-noreply@7zi.studio}
      # 数据库
      - DATABASE_PATH=/app/data/7zi.db
      # Redis 缓存
      - REDIS_URL=redis://redis:6379

    volumes:
      - 7zi-data:/app/data:rw
      - 7zi-logs:/app/logs:rw

    # 资源限制（优化版：512MB → 384MB）
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 384M
        reservations:
          cpus: "0.25"
          memory: 192M

    # 健康检查
    healthcheck:
      test: ["CMD", "/usr/local/bin/healthcheck.sh"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

    # 日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    depends_on:
      redis:
        condition: service_healthy

    networks:
      - 7zi-network

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /tmp
      - /app/tmp:size=30M,mode=1777

    read_only: true

  # ============================================
  # Redis 缓存服务
  # ============================================
  redis:
    image: redis:7-alpine
    container_name: 7zi-redis
    restart: always

    command: >
      redis-server
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --appendfsync everysec

    volumes:
      - redis-data:/data:rw

    # 资源限制
    deploy:
      resources:
        limits:
          cpus: "0.25"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 128M

    # 健康检查
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s

    # 日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "5m"
        max-file: "2"

    networks:
      - 7zi-network

    security_opt:
      - no-new-privileges:true

  # ============================================
  # Nginx 反向代理（资源优化版）
  # ============================================
  nginx:
    image: nginx:1.25-alpine
    container_name: 7zi-nginx
    restart: always

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
      - 7zi-nginx-logs:/var/log/nginx:rw
      - nginx-cache:/var/cache/nginx:rw
      - nginx-run:/var/run:rw
      - certbot-webroot:/var/www/certbot:rw

    depends_on:
      7zi-frontend:
        condition: service_healthy

    # 资源限制（优化版）
    deploy:
      resources:
        limits:
          cpus: "0.3"
          memory: 192M
        reservations:
          cpus: "0.1"
          memory: 64M

    # 健康检查
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "--timeout=5", "http://localhost/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

    # 日志轮转
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    networks:
      - 7zi-network

    security_opt:
      - no-new-privileges:true

    tmpfs:
      - /var/tmp:size=10M,mode=1777
      - /tmp:size=10M,mode=1777
      - /var/lib/nginx/tmp:size=10M,mode=1777

    read_only: true

  # ============================================
  # Certbot (Let's Encrypt SSL 证书管理)
  # ============================================
  certbot:
    image: certbot/certbot:latest
    container_name: 7zi-certbot
    restart: "no"

    volumes:
      - ./nginx/ssl:/etc/letsencrypt:rw
      - certbot-webroot:/var/www/certbot:rw

# ============================================
# 网络配置
# ============================================
networks:
  7zi-network:
    driver: bridge
    ipam:
      driver: default
      config:
        - subnet: 172.28.0.0/16

# ============================================
# 数据卷配置
# ============================================
volumes:
  # Next.js 数据
  7zi-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./data

  7zi-logs:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ./logs

  # Redis 数据
  redis-data:
    driver: local

  # Nginx 相关
  7zi-nginx-logs:
    driver: local

  nginx-cache:
    driver: local

  nginx-run:
    driver: local

  # SSL 证书
  certbot-webroot:
    driver: local

# ============================================
# 资源使用总结
# ============================================
#
# 服务资源分配:
#
# | 服务          | CPU 限制 | 内存限制 | CPU 预留 | 内存预留 |
# |---------------|---------|---------|---------|---------|
# | 7zi-frontend  | 0.75    | 384MB   | 0.25    | 192MB   |
# | redis         | 0.25    | 256MB   | 0.1     | 128MB   |
# | nginx         | 0.3     | 192MB   | 0.1     | 64MB    |
# | 总计          | 1.3     | 832MB   | 0.45    | 384MB   |
#
# 优化前 vs 优化后:
#
# | 指标         | 优化前 | 优化后 | 节省   |
# |-------------|--------|--------|--------|
# | CPU 限制     | 1.5    | 1.3    | 13%    |
# | 内存限制     | 768MB  | 832MB  | -8%*   |
# | 内存预留     | 320MB  | 384MB  | -20%*  |
#
# * 内存总量增加是因为添加了 Redis 服务 (256MB)
# 实际应用内存从 512MB 降至 384MB (节省 25%)
#
# ============================================
