# ============================================
# 7zi-frontend 统一 CI/CD Pipeline (v7)
# ============================================
# 特性：
# - 统一的工作流，适用于 PR、main 和 develop 分支
# - 智能变更检测（跳过不必要的测试）
# - 多层缓存策略（npm, Next.js turbo, Docker GHA cache）
# - 并行执行（lint, typecheck, 分片测试）
# - 测试分片（4x 并行单元测试）
# - Job 超时控制（防止无限运行）
# - 针对 PR 和 main 分支的不同部署策略
# - SSH 密钥认证（移除密码认证）
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      skip-tests:
        description: '跳过测试（不推荐）'
        required: false
        default: false
        type: boolean
      run-e2e:
        description: '运行 E2E 测试'
        required: false
        default: true
        type: boolean
      environment:
        description: '部署环境'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      deploy-strategy:
        description: '部署策略'
        required: true
        default: 'blue-green'
        type: choice
        options:
          - blue-green
          - rolling

# ============================================
# 安全：仅限必要的权限
# ============================================
permissions:
  contents: read
  deployments: write
  pull-requests: write
  actions: write
  packages: write

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Job 1: 变更检测
  # ============================================
  changes:
    name: 检测变更
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      src-changed: ${{ steps.changes.outputs.src }}
      tests-changed: ${{ steps.changes.outputs.tests }}
      config-changed: ${{ steps.changes.outputs.config }}
      has-changes: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: 获取变更文件
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            src/**/*.{ts,tsx,js,jsx}
            tests/**/*.{ts,tsx,js,jsx}
            e2e/**/*.spec.ts
            **/package.json
            **/Dockerfile*
            **/*.config.*

  # ============================================
  # Job 2: 依赖安装和缓存（共享 node_modules）
  # ============================================
  setup:
    name: 安装依赖
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.key }}
    steps:
      - uses: actions/checkout@v4

      # ✅ 使用 GitHub Actions cache 缓存 node_modules
      - name: 缓存 node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖（如果缓存未命中）
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

  # ============================================
  # Job 3: 安全审计（仅 push 或手动触发）
  # ============================================
  security:
    name: 安全审计
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup]
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        run: npm ci --prefer-offline

      - name: 运行 npm audit
        run: npm audit --audit-level=moderate || true

      - name: 检查敏感文件
        run: |
          echo "🔍 检查敏感文件..."
          if grep -r "sk-\|api_key\|secret" --include="*.ts" --include="*.tsx" --include="*.js" --include="*.jsx" src/ 2>/dev/null | grep -v "//" | grep -v "/\*" | grep -v "\"secret\""; then
            echo "⚠️ 警告：代码中发现潜在的敏感信息"
          else
            echo "✅ 未发现明显的敏感信息"
          fi

  # ============================================
  # Job 4: 代码检查（并行）
  # ============================================
  lint:
    name: 代码检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup]
    steps:
      - uses: actions/checkout@v4

      # ✅ 共享 node_modules 缓存
      - name: 缓存 node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: 运行 ESLint
        run: npm run lint

      - name: 检查代码格式
        run: npm run format:check
        continue-on-error: true

  # ============================================
  # Job 5: TypeScript 类型检查（并行）
  # ============================================
  typecheck:
    name: 类型检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [setup]
    steps:
      - uses: actions/checkout@v4

      # ✅ 共享 node_modules 缓存
      - name: 缓存 node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: TypeScript 检查
        run: npm run type-check

  # ============================================
  # Job 6: 单元测试（4 分片并行）
  # ============================================
  test-unit:
    name: 单元测试 (分片 ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: [setup]
    if: inputs.skip-tests != true
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      # ✅ 共享 node_modules 缓存
      - name: 缓存 node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: 运行单元测试
        run: npm run test:run -- --shard=${{ matrix.shard }}/4

      - name: 上传覆盖率（仅第一个分片）
        if: matrix.shard == 1
        uses: actions/upload-artifact@v7
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

  # ============================================
  # Job 7: 构建
  # ============================================
  build:
    name: 构建
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, typecheck, test-unit]
    outputs:
      build-hash: ${{ steps.build-info.outputs.hash }}
      build-size: ${{ steps.build-info.outputs.size }}
    steps:
      - uses: actions/checkout@v4

      # ✅ 共享 node_modules 缓存
      - name: 缓存 node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      # ✅ Next.js Turbo Cache（增量构建）
      - name: 缓存 Next.js turbo
        uses: actions/cache@v4
        with:
          path: .next/cache
          key: ${{ runner.os }}-nextjs-turbo-${{ hashFiles('**/package-lock.json') }}-${{ hashFiles('src/**/*.{ts,tsx,js,jsx}') }}
          restore-keys: |
            ${{ runner.os }}-nextjs-turbo-${{ hashFiles('**/package-lock.json') }}-
            ${{ runner.os }}-nextjs-turbo-

      - name: 安装依赖
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: 构建应用
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: 分析构建大小
        id: build-info
        run: |
          echo "📊 构建分析"
          echo "=================="
          echo "总大小: $(du -sh .next/ | cut -f1)"
          echo "静态文件: $(du -sh .next/static/ 2>/dev/null | cut -f1 || echo 'N/A')"
          echo "服务器: $(du -sh .next/server/ 2>/dev/null | cut -f1 || echo 'N/A')"

          BUILD_SIZE=$(du -sm .next/standalone 2>/dev/null | cut -f1 || echo "0")
          echo "size=${BUILD_SIZE}" >> $GITHUB_OUTPUT
          echo "hash=${{ github.sha }}" >> $GITHUB_OUTPUT

          if [ "$BUILD_SIZE" -gt 300 ]; then
            echo "⚠️ 警告：构建大小超过 300MB"
          fi

      - name: 上传构建产物
        uses: actions/upload-artifact@v7
        with:
          name: build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

  # ============================================
  # Job 8: E2E 测试（仅在 PR 和 main 分支）
  # ============================================
  test-e2e:
    name: E2E 测试 (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: inputs.run-e2e == true && (github.event_name == 'pull_request' || github.ref == 'refs/heads/main')
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]
    steps:
      - uses: actions/checkout@v4

      # ✅ 共享 node_modules 缓存
      - name: 缓存 node_modules
        uses: actions/cache@v4
        id: node-modules-cache
        with:
          path: |
            node_modules
            ~/.npm
          key: ${{ runner.os }}-node-modules-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-modules-

      - name: 设置 Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: 安装依赖
        if: steps.node-modules-cache.outputs.cache-hit != 'true'
        run: npm ci --prefer-offline

      - name: 安装 Playwright 浏览器
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .

      - name: 运行 E2E 测试
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          CI: true

      - name: 上传 Playwright 报告
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

  # ============================================
  # Job 9: Docker 构建（仅 main 分支）
  # ============================================
  docker:
    name: Docker 构建
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [build]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
      image-digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4

      - name: 设置 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录到 Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 提取元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
            type=raw,value=${{ github.run_number }}

      - name: 构建并推送
        id: build
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.optimized
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # ✅ 使用 GHA cache（比本地缓存更高效）
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
          platforms: linux/amd64,linux/arm64

      - name: 镜像详情
        run: |
          echo "🐳 Docker 镜像已构建" >> $GITHUB_STEP_SUMMARY
          echo "======================" >> $GITHUB_STEP_SUMMARY
          echo "- **Tags**: ${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Digest**: ${{ steps.build.outputs.digest }}" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 10: 预部署检查
  # ============================================
  pre-deploy:
    name: 预部署检查
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [build]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: 下载构建产物
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .

      - name: 验证构建完整性
        run: |
          echo "🔍 运行预部署检查..."
          test -d .next/standalone || { echo "❌ 缺少 standalone 构建"; exit 1; }
          test -d .next/static || { echo "❌ 缺少静态文件"; exit 1; }
          test -d public || { echo "❌ 缺少 public 目录"; exit 1; }
          test -f .next/standalone/server.js || { echo "❌ 缺少 server.js"; exit 1; }
          echo "✅ 所有预部署检查通过！"

      - name: 安全扫描
        run: |
          echo "🔒 运行安全扫描..."
          if find . -name "*.env.local" -o -name "*.pem" -o -name "*.key" 2>/dev/null | grep -q .; then
            echo "⚠️ 警告：发现潜在的敏感文件"
          fi
          echo "✅ 安全扫描完成"

      - name: 生成部署清单
        run: |
          cat > deployment-manifest.json << EOF
          {
            "version": "${{ github.sha }}",
            "branch": "${{ github.ref_name }}",
            "commit": "${{ github.sha }}",
            "timestamp": "$(date -u +"%Y-%m-%dT%H:%M:%SZ")",
            "actor": "${{ github.actor }}",
            "workflow": "${{ github.workflow }}",
            "run_id": "${{ github.run_id }}",
            "run_number": "${{ github.run_number }}"
          }
          EOF

      - name: 上传部署清单
        uses: actions/upload-artifact@v7
        with:
          name: deployment-manifest
          path: deployment-manifest.json
          retention-days: 30

  # ============================================
  # Job 11: 部署到 Staging（自动，SSH 密钥）
  # ============================================
  deploy-staging:
    name: 部署到 Staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [docker, pre-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.7zi.com
    steps:
      - uses: actions/checkout@v4

      # ✅ 使用 SSH 密钥认证（替代密码）
      - name: 设置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: 部署到 Staging
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            cd /opt/7zi-frontend
            
            echo "🚀 开始 Staging 部署..."
            
            # 拉取最新代码
            git pull origin main
            
            # 执行零停机部署
            if [ -f deploy-zero-downtime.sh ]; then
              chmod +x deploy-zero-downtime.sh
              ./deploy-zero-downtime.sh deploy
            else
              docker-compose -f docker-compose.prod.yml pull
              docker-compose -f docker-compose.prod.yml up -d --no-deps --build
            fi
            
            # 健康检查
            echo "⏳ 等待健康检查..."
            sleep 15
            for i in {1..5}; do
              if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ Staging 部署成功！"
                exit 0
              fi
              echo "尝试 $i 失败，重试中..."
              sleep 5
            done
            
            echo "❌ 健康检查失败！"
            docker-compose -f docker-compose.prod.yml logs --tail=50
            exit 1
          ENDSSH

  # ============================================
  # Job 12: 部署到 Production（手动触发，SSH 密钥）
  # ============================================
  deploy-production:
    name: 部署到 Production
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [docker, pre-deploy]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: https://7zi.com
    steps:
      - uses: actions/checkout@v4

      # ✅ 使用 SSH 密钥认证（替代密码）
      - name: 设置 SSH 密钥
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H ${{ secrets.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: 创建 release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_TAG="v$(date +%Y%m%d-%H%M%S)"
          git tag -a "$RELEASE_TAG" -m "Release $(date +%Y-%m-%d) - $RELEASE_TAG"
          git push origin --tags || true
          echo "🏷️ 已创建 release tag: $RELEASE_TAG"

      - name: 部署到 Production
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          DEPLOY_STRATEGY: ${{ inputs.deploy-strategy }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            cd /opt/7zi-frontend
            
            echo "🚀 开始 Production 部署..."
            echo "策略: ${DEPLOY_STRATEGY:-blue-green}"
            
            # 备份当前版本
            BACKUP_DIR="/opt/backups/7zi-frontend-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r .next "$BACKUP_DIR/" 2>/dev/null || true
            echo "📦 备份已创建: $BACKUP_DIR"
            
            # 拉取最新代码
            git pull origin main
            
            # 执行部署
            if [ -f deploy-zero-downtime.sh ]; then
              chmod +x deploy-zero-downtime.sh
              if [ "${DEPLOY_STRATEGY}" = "rolling" ]; then
                ./deploy-zero-downtime.sh rolling
              else
                ./deploy-zero-downtime.sh deploy
              fi
            else
              docker-compose -f docker-compose.prod.yml pull
              docker-compose -f docker-compose.prod.yml up -d --no-deps --build
            fi
            
            # 健康检查（10次重试）
            echo "⏳ 等待健康检查..."
            sleep 20
            for i in {1..10}; do
              if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ Production 部署成功！"
                
                # 清理旧备份（保留最近5个）
                ls -dt /opt/backups/7zi-frontend-* 2>/dev/null | tail -n +6 | xargs -r rm -rf
                
                exit 0
              fi
              echo "尝试 $i 失败，重试中..."
              sleep 5
            done
            
            echo "❌ 健康检查失败！正在回滚..."
            
            # 回滚
            docker-compose -f docker-compose.prod.yml down || true
            if [ -d "$BACKUP_DIR/.next" ]; then
              cp -r "$BACKUP_DIR/.next" ./
            fi
            docker-compose -f docker-compose.prod.yml up -d
            
            exit 1
          ENDSSH

      - name: 验证部署
        run: |
          echo "验证 Production 部署..."
          for i in {1..10}; do
            if curl -sf https://7zi.com/ > /dev/null 2>&1; then
              echo "✅ Production 可访问"
              exit 0
            fi
            echo "尝试 $i 失败，重试中..."
            sleep 5
          done
          echo "⚠️ 警告：Production 验证失败"

      - name: 创建 GitHub Release
        if: success()
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: v${{ github.run_number }}
          release_name: Release v${{ github.run_number }}
          body: |
            ## 🚀 Deployment v${{ github.run_number }}

            **Commit**: ${{ github.sha }}
            **Branch**: ${{ github.ref_name }}

            ### Docker Image
            - `ghcr.io/${{ github.repository }}:latest`
            - `ghcr.io/${{ github.repository }}:${{ github.run_number }}`
            - `ghcr.io/${{ github.repository }}@${{ needs.docker.outputs.image-digest }}`

            ### Changes
            See the [commit history](https://github.com/${{ github.repository }}/commits/${{ github.sha }})
          draft: false
          prerelease: false

  # ============================================
  # Job 13: CI/CD 总结
  # ============================================
  summary:
    name: CI/CD 总结
    runs-on: ubuntu-latest
    timeout-minutes: 3
    needs:
      [
        lint,
        typecheck,
        test-unit,
        build,
        test-e2e,
        docker,
        pre-deploy,
        deploy-staging,
        deploy-production,
      ]
    if: always()
    steps:
      - name: 生成总结
        run: |
          echo "## 🚀 CI/CD Pipeline 报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 工作流信息" >> $GITHUB_STEP_SUMMARY
          echo "- **仓库**: ${{ github.repository }}" >> $GITHUB_STEP_SUMMARY
          echo "- **分支**: ${{ github.ref_name }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit**: ${{ github.sha }}" >> $GITHUB_STEP_SUMMARY
          echo "- **执行者**: ${{ github.actor }}" >> $GITHUB_STEP_SUMMARY
          echo "- **事件**: ${{ github.event_name }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### Job 状态" >> $GITHUB_STEP_SUMMARY
          echo "| Job | 状态 |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| 代码检查 | ${{ needs.lint.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 类型检查 | ${{ needs.typecheck.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 单元测试 | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 构建 | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E 测试 | ${{ needs.test-e2e.result || '跳过' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Docker | ${{ needs.docker.result || '跳过' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| 预部署检查 | ${{ needs.pre-deploy.result || '跳过' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging 部署 | ${{ needs.deploy-staging.result || '跳过' }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production 部署 | ${{ needs.deploy-production.result || '跳过' }} |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.lint.result }}" == "success" ] && \
             [ "${{ needs.typecheck.result }}" == "success" ] && \
             [ "${{ needs.test-unit.result }}" == "success" ] && \
             [ "${{ needs.build.result }}" == "success" ]; then
            echo "### ✅ 所有关键 Job 通过！" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ❌ 部分 Job 失败" >> $GITHUB_STEP_SUMMARY
          fi
