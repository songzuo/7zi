name: Preview Deployment

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches: [main, develop]

jobs:
  preview:
    name: Deploy Preview
    runs-on: ubuntu-latest
    if: github.event.action != 'closed'
    environment:
      name: preview-pr-${{ github.event.number }}
      url: ${{ steps.deploy.outputs.url }}
    steps:
      - uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run type check
        run: npm run type-check

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Deploy to preview
        id: deploy
        run: |
          echo "Deploying preview for PR #${{ github.event.number }}"
          echo "Branch: ${{ github.head_ref }}"
          echo "Commit: ${{ github.sha }}"
          # Add your deployment command here
          # Example for Vercel:
          # npx vercel deploy --token=${{ secrets.VERCEL_TOKEN }} --prebuilt
          echo "url=https://preview-${{ github.event.number }}.7zi.com" >> $GITHUB_OUTPUT

      - name: Comment PR with preview URL
        uses: actions/github-script@v7
        if: github.event.action == 'opened'
        with:
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: '🚀 Preview environment deployed!\n\nURL: ${{ steps.deploy.outputs.url }}'
            })

  cleanup-preview:
    name: Cleanup Preview
    runs-on: ubuntu-latest
    if: github.event.action == 'closed'
    steps:
      - uses: actions/checkout@v6

      - name: Delete preview environment
        run: |
          echo "Cleaning up preview for PR #${{ github.event.number }}"
          # Add your cleanup command here
          # Example for Vercel:
          # npx vercel rm --token=${{ secrets.VERCEL_TOKEN }} --yes --scope=your-org
