# ============================================
# 7zi-frontend 快速部署
# 仅用于紧急情况下手动触发快速部署
# 正常部署请使用主 CI/CD Pipeline
# ============================================

name: Quick Deploy

on:
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
      skip_tests:
        description: 'Skip tests (use with caution)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'

jobs:
  # ============================================
  # 快速构建（跳过测试可选）
  # ============================================
  quick-build:
    name: Quick Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Quick lint check
        if: ${{ !inputs.skip_tests }}
        run: npm run lint

      - name: Quick type check
        if: ${{ !inputs.skip_tests }}
        run: npm run type-check

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: quick-build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

  # ============================================
  # 快速部署
  # ============================================
  deploy:
    name: Quick Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest
    needs: [quick-build]
    environment:
      name: ${{ inputs.environment }}
      url: ${{ inputs.environment == 'production' && 'https://7zi.com' || 'https://staging.7zi.com' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: quick-build
          path: .

      - name: Install sshpass
        run: sudo apt-get install -y sshpass

      - name: Create deployment package
        run: |
          tar -czf deploy-package.tar.gz \
            .next \
            public \
            Dockerfile \
            docker-compose.prod.yml \
            nginx \
            package.json

      - name: Deploy to server
        env:
          SSH_HOST: ${{ inputs.environment == 'production' && secrets.PRODUCTION_HOST || secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASS: ${{ secrets.DEPLOY_PASS }}
          DEPLOY_PATH: /opt/7zi-frontend
        run: |
          echo "🚀 Quick deploying to ${{ inputs.environment }}..."
          
          # 上传部署包
          sshpass -p "$SSH_PASS" scp -o StrictHostKeyChecking=no \
            deploy-package.tar.gz \
            $SSH_USER@$SSH_HOST:/tmp/
          
          # 执行部署
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'ENDSSH'
            set -e
            
            DEPLOY_PATH="/opt/7zi-frontend"
            
            echo "📦 解压部署包..."
            mkdir -p $DEPLOY_PATH
            cd $DEPLOY_PATH
            tar -xzf /tmp/deploy-package.tar.gz
            rm /tmp/deploy-package.tar.gz
            
            # 确保环境配置存在
            if [ ! -f .env.production ]; then
              echo "⚠️ .env.production 不存在"
            fi
            
            echo "🐳 构建 Docker 镜像..."
            docker-compose -f docker-compose.prod.yml build
            
            echo "🔄 重启服务..."
            docker-compose -f docker-compose.prod.yml down || true
            docker-compose -f docker-compose.prod.yml up -d
            
            echo "⏳ 等待服务启动..."
            sleep 15
            
            # 健康检查
            for i in {1..5}; do
              if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ 快速部署成功！"
                exit 0
              fi
              echo "健康检查 $i/5 失败，等待重试..."
              sleep 5
            done
            
            echo "❌ 健康检查失败！"
            docker-compose -f docker-compose.prod.yml logs --tail=50
            exit 1
          ENDSSH

      - name: Verify deployment
        run: |
          URL="${{ inputs.environment == 'production' && 'https://7zi.com' || 'https://staging.7zi.com' }}"
          echo "验证部署: $URL"
          curl -sf "$URL/" > /dev/null && echo "✅ 网站可访问" || echo "⚠️ 无法访问"

      - name: Cleanup
        if: always()
        run: rm -f deploy-package.tar.gz
