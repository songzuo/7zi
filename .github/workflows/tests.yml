# ==========================================
# 测试专用 Workflow (Optimized v2)
# 独立运行测试，快速反馈
# ==========================================

name: Tests

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

env:
  # ✅ Fixed: Match package.json (Next.js 16 requires Node 22)
  NODE_VERSION: '22'

jobs:
  # ----------------------------------------
  # 单元测试
  # ----------------------------------------
  unit-tests:
    name: Unit Tests (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # ✅ Optimization: Parallel test execution
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Run unit tests
        run: npm run test:run -- --shard=${{ matrix.shard }}/4

      - name: Upload coverage (first shard only)
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/
          retention-days: 30

  # ----------------------------------------
  # E2E 测试
  # ----------------------------------------
  e2e-tests:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # ✅ Optimization: Only run on PR and main (not develop)
    if: github.event_name == 'pull_request' || github.ref == 'refs/heads/main'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      - name: Run E2E tests
        run: npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 30

  # ----------------------------------------
  # 测试报告汇总
  # ----------------------------------------
  test-report:
    name: Test Report
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [unit-tests, e2e-tests]
    if: always()

    steps:
      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report
          path: coverage
        continue-on-error: true

      - name: Create test summary
        run: |
          echo "## 🧪 测试报告" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 单元测试" >> $GITHUB_STEP_SUMMARY
          echo "- 状态：${{ needs.unit-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### E2E 测试" >> $GITHUB_STEP_SUMMARY
          echo "- 状态：${{ needs.e2e-tests.result }}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 覆盖率报告" >> $GITHUB_STEP_SUMMARY
          echo "查看 artifacts 下载完整报告" >> $GITHUB_STEP_SUMMARY
