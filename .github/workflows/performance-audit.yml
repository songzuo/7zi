# ============================================
# Lighthouse CI Performance Audit Pipeline
# v1.0 - Phase 3: Performance Validation
# ============================================
#
# Purpose:
# - Run Lighthouse CI performance audits against built application
# - Validate Core Web Vitals metrics
# - Enforce performance budgets in CI
# - Block deployments on performance regressions
#
# Core Web Vitals Thresholds:
# - LCP: < 2500ms (good), < 4000ms (needs-improvement)
# - CLS: < 0.1 (good), < 0.25 (needs-improvement)
# - INP: < 200ms (good), < 500ms (needs-improvement)
# - FCP: < 1800ms (good), < 3000ms (needs-improvement)
# - TTFB: < 800ms (good), < 1800ms (needs-improvement)
#
# Category Score Thresholds:
# - Performance: >= 80%
# - Accessibility: >= 85%
# - Best Practices: >= 85%
# - SEO: >= 85%
#
# ============================================

name: Performance Audit (Lighthouse CI)

on:
  # Run on PR to main/develop and on push to main
  pull_request:
    branches: [main, develop]
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'lighthouserc.json'
      - 'scripts/performance-audit.mjs'
  push:
    branches: [main]
    paths:
      - 'src/**'
      - '.github/workflows/**'
      - 'lighthouserc.json'
      - 'scripts/performance-audit.mjs'
  # Manual trigger
  workflow_dispatch:
    inputs:
      url:
        description: 'Target URL to audit'
        required: false
        default: 'https://staging.7zi.com'
        type: string
      budget:
        description: 'Budget file path'
        required: false
        default: './lighthouserc.json'
        type: string
      server:
        description: 'Start local server'
        required: false
        default: 'true'
        type: boolean

# ============================================
# Permissions
# ============================================
permissions:
  contents: read
  pull-requests: write
  actions: read

# ============================================
# Concurrentcy Control
# ============================================
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# ============================================
# Environment
# ============================================
env:
  NODE_VERSION: '22'
  # @lhci/cli 这个包整体都在 0.x 线（npm dist-tags: latest=0.15.1）。
  # 原来这里写的 '5.0.0' 在 npm 上不存在，`npm install -g` 必报
  #   npm error code ETARGET / No matching version found for @lhci/cli@5.0.0
  # → Install 步 failure → Run Lighthouse CI 被判 skipped → Parse 再炸一次，
  #   于是这个 job 在每次 push 上稳定红一次。
  LHCI_VERSION: '0.15.1'

# ============================================
# Jobs
# ============================================
jobs:
  # ============================================
  # Job 1: Setup and Build
  # ============================================
  setup-and-build:
    name: Setup & Build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline

      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      # ⚠️ include-hidden-files 必须显式打开。
      # upload-artifact@v4 默认 false，且排除是**相对每个 path 根**判定的：
      #   path: .next/static      → 根下没有以 `.` 开头的段 → 94 条全进
      #   path: .next/standalone  → 里面的 `.next/` 正好是隐藏目录 → 整棵丢
      # 这导致 artifact 看着有 64MB（server.js + node_modules 都在），
      # 但真正让 next 认出「这是一份 production build」的元数据全没了。
      # 实测 v10 run 40299770117 的 artifact（ID 12640161574）：
      #   .next/standalone/server.js                         1
      #   .next/standalone/.next/BUILD_ID                    0  ← 丢
      #   .next/standalone/.next/required-server-files.json  0  ← 丢
      #   .next/standalone/.next/server                      0  ← 丢
      # 后果见 lighthouse-local：server 起得来，一访问就
      #   Error: Could not find a production build in the './.next' directory.
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          include-hidden-files: true
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

      - name: Upload Lighthouse config
        uses: actions/upload-artifact@v4
        with:
          name: lighthouserc
          path: lighthouserc.json
          retention-days: 7

  # ============================================
  # Job 2: Lighthouse CI Audit (Local Server)
  # ============================================
  lighthouse-local:
    name: Lighthouse CI (Local)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: setup-and-build

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # 不再 `npm ci`：这个 job 只做两件事 —— 起 .next/standalone/server.js、
      # 跑全局安装的 lhci。standalone 自带 node_modules，全量装一遍纯浪费约 90s，
      # 还多一个失败面。
      - name: Download build artifacts
        uses: actions/download-artifact@v4
        with:
          name: build
          path: .

      - name: Download Lighthouse config
        uses: actions/download-artifact@v4
        with:
          name: lighthouserc
          path: .

      # next.config.ts 里是 output:'standalone'，`next build` 会把 server.js
      # 和它自己的 node_modules 放进 .next/standalone/，但**不含** .next/static
      # 和 public —— 这两者必须复制到 .next/standalone 里面，而不是 .next/ 下面。
      #
      # 原写法有两处错：
      #  1) `cp -r .next/static .next/` 是在自己复制自己。upload-artifact 对多路径
      #     取公共前缀（仓库根），下载到 path:'.' 之后 .next/static 已经在原位，
      #     于是报 cp: '.next/static' and '.next/static' are the same file。
      #  2) `cp -r .next/standalone/* .next/` 把 standalone 的内容往上摊，
      #     而后面又 `node .next/standalone/server.js` —— 依赖位置全错。
      - name: Prepare standalone server
        run: |
          set -euo pipefail
          if [ ! -f .next/standalone/server.js ]; then
            echo "::error::.next/standalone/server.js 不存在，构建产物不完整"
            # 不要写 `| head -20`：在 set -o pipefail 下 head 提前关管道，
            # ls 收 SIGPIPE 返回 2，整条 step 就被判红（上一轮踩过）。
            # sed 会读完全部输入，不产生 SIGPIPE。
            ls -la .next 2>/dev/null | sed -n '1,20p' || true
            exit 1
          fi
          mkdir -p .next/standalone/.next
          rm -rf .next/standalone/.next/static
          cp -r .next/static .next/standalone/.next/static
          # public/ 不一定存在，缺了不算错
          if [ -d public ]; then
            rm -rf .next/standalone/public
            cp -r public .next/standalone/public
          else
            echo "no public/ dir, skip"
          fi
          # 检查项必须能反映「production build 在不在」。
          # v10 这里只查 server.js / node_modules / .next/static / public，
          # 四项全 ok 却仍然起不来 —— 因为真正缺的是 .next/BUILD_ID
          # （`next start` / standalone server.js 靠它判定目录里有一个可用构建，
          #   缺失时的报错就是 production-start-no-build-id）。
          echo "--- .next/standalone 关键产物 ---"
          MISS=0
          for f in server.js .next/BUILD_ID .next/required-server-files.json \
                   .next/server node_modules .next/static public; do
            if [ -e ".next/standalone/$f" ]; then
              echo "  ok       $f"
            else
              echo "  MISSING  $f"
              MISS=1
            fi
          done
          if [ "$MISS" -ne 0 ]; then
            # 只告警不判红：这个 job 的红灯只会换来一封没用的邮件。
            # 但要把现场打全 —— 下次一眼就能看出是 artifact 丢了哪一层。
            echo "::warning::standalone 产物不完整，node server.js 会报 Could not find a production build"
            echo "--- .next 目录树（前 40 行）---"
            find .next -maxdepth 2 -print 2>/dev/null | sed -n '1,40p' || true
            echo "--- 全盘找 BUILD_ID ---"
            find . -maxdepth 6 -name BUILD_ID 2>/dev/null | sed -n '1,10p' || true
            echo "--- 工作区顶层（下载后，前 20 行）---"
            ls -1a . 2>/dev/null | sed -n '1,20p' || true
          fi
          echo "--- .next/standalone 顶层（前 15 项）---"
          # 同上前提：不用 `| head`，避免 SIGPIPE + pipefail 判红。
          ls -1 .next/standalone 2>/dev/null | sed -n '1,15p' || true
          du -sh .next/standalone 2>/dev/null || true

      - name: Install Lighthouse CI
        # 安装本身容错：指定版本装不上就退 latest，绝不让这一步成为硬门。
        # 原先是裸 `npm install -g @lhci/cli@${{ env.LHCI_VERSION }}`，
        # 版本号一错（v9 就是）整条 job 直接红。
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "target: @lhci/cli@${LHCI_VERSION}"
          if npm install -g "@lhci/cli@${LHCI_VERSION}"; then
            echo "installed @lhci/cli@${LHCI_VERSION}"
            exit 0
          fi
          echo "::warning::@lhci/cli@${LHCI_VERSION} 安装失败，回退 @latest"
          npm install -g @lhci/cli@latest

      # 这一段是整条流水线里唯一「不可控」的部分：要真起一个 Node 服务、
      # 真起一个 Chrome。把它做成硬门 = 每次 push 稳定红一次、稳定一封邮件。
      # 所以：continue-on-error，红也只在 Step Summary 里留证，不判红流水线。
      # 断言本身在 lighthouserc.json 里已全部降为 warn，正常不会非零。
      - name: Run Lighthouse CI
        id: lhci
        continue-on-error: true
        run: |
          set -uo pipefail
          # 直接起 standalone server。原先是 `cd .next && npm run start`，
          # 那是 `next start`，需要完整的 .next/ 布局，而这个 job 只下载了
          # standalone + static 两部分的 artifact，根本起不来。
          ( cd .next/standalone && exec env PORT=3000 HOSTNAME=127.0.0.1 node server.js ) &
          SERVER_PID=$!
          trap 'kill $SERVER_PID 2>/dev/null || true' EXIT

          echo "Waiting for server on :3000 ..."
          READY=0
          CODE=""
          for i in $(seq 1 45); do
            # 只认 2xx/3xx。原写法有两个坑：
            #  1) `CODE=$(curl -s -o /dev/null -w '%{http_code}' URL || echo 000)`
            #     curl 自己失败时 -w 已经输出 000，`|| echo 000` 再补一次 →
            #     CODE 变成 "000000"，`!= "000"` 判真 → 服务根本没起来就被
            #     认定 ready。v10 日志实证：first status=000000 (after 1s)。
            #  2) 任何码都算「起来了」，包括 5xx —— 等于拿错误页去跑
            #     Lighthouse，Chrome 直接 CHROME_INTERSTITIAL_ERROR，采集全空。
            raw=$(curl -s -o /tmp/_probe.html -w '%{http_code}' \
                    --max-time 5 http://127.0.0.1:3000/ 2>/dev/null) || raw=""
            case "$raw" in
              2??|3??) CODE="$raw" ;;
              *)       CODE="000" ;;
            esac
            if [ "$CODE" != "000" ]; then
              echo "server up, first status=$CODE (after ${i}s)"
              READY=1
              break
            fi
            sleep 1
          done
          if [ "$READY" -ne 1 ]; then
            echo "::error::standalone server 45s 内未在 :3000 返回 2xx/3xx"
            echo "--- 最后一次响应体（前 30 行）---"
            sed -n '1,30p' /tmp/_probe.html 2>/dev/null || true
            echo "--- .next/standalone/.next 目录 ---"
            ls -la .next/standalone/.next 2>/dev/null | sed -n '1,20p' || true
            exit 1
          fi

          # ── 首屏诊断（v17 新增）──────────────────────────────────────────
          # 唯一目的：把「页面到底画没画、被什么挡住」变成日志里的**事实**，
          # 而不是靠猜。四个观察点：
          #   a) `/` 是 307 → 落到哪个 URL（next-intl 的 locale 重定向）
          #   b) 响应里有没有 CSP 头、`script-src` 里有没有 'unsafe-inline'
          #   c) 服务端吐的 <html> 标签上有没有 class（没有 = 主题守卫会生效）
          #   d) 有多少内联 <script>（>0 且 CSP 不带 'unsafe-inline'/nonce 就必被拦）
          # 注意必须 -L：`/` 是 307，直接抓拿不到首页正文。
          echo "──────────── 首屏诊断 ────────────"
          echo "[request /] $(curl -s -o /dev/null -w '%{http_code}' \
            --max-time 5 http://127.0.0.1:3000/ 2>/dev/null || echo 000)"
          curl -sSL --max-time 20 -o /tmp/_home.html \
            -w '[follow -L] %{http_code} %{size_download}B final=%{url_effective}\n' \
            http://127.0.0.1:3000/ 2>/dev/null || echo "[follow -L] curl 失败"
          echo "[响应头]"
          curl -sS -L -D - -o /dev/null --max-time 20 http://127.0.0.1:3000/ 2>/dev/null \
            | tr -d '\r' \
            | grep -iE '^(HTTP/|content-security-policy|content-type|cross-origin-embedder-policy)' \
            | sed 's/^/    /' || true
          echo "[<html> 标签] $(grep -o '<html[^>]*>' /tmp/_home.html 2>/dev/null | sed -n '1p')"
          echo "[内联 <script> 数] $(grep -o '<script[^>]*>' /tmp/_home.html 2>/dev/null | grep -vc 'src=' || true)"
          echo "[带 src 的 <script> 数] $(grep -o '<script[^>]*>' /tmp/_home.html 2>/dev/null | grep -c 'src=' || true)"
          echo "[样式表 link]"
          grep -o '<link[^>]*stylesheet[^>]*>' /tmp/_home.html 2>/dev/null | sed 's/^/    /' || true
          echo "[样式表 link 数] $(grep -c 'stylesheet' /tmp/_home.html 2>/dev/null || true)"
          echo "─────────────────────────────────"

          # 拆成 collect + assert，**不跑 upload**。理由：
          #   lighthouserc.json 原来 upload.target=temporary-public-storage，
          #   那要多一次到 Google 存储的往返 —— 纯外网依赖，白送一个失败面。
          #   报告我们本来就用 upload-artifact 自己存，不需要外部存储。
          lhci collect --config=./lighthouserc.json \
            --url=http://127.0.0.1:3000/
          # 断言级别全是 warn，正常返回 0；万一非零也不该阻断。
          lhci assert --config=./lighthouserc.json || \
            echo "::warning::lhci assert 返回非零（断言已全 warn，属意外，见上方输出）"

          # 归一化：lhci collect 产出的是 manifest.json + lhr-*.json，
          # 而下游两步（Parse Lighthouse results / Performance Budget）
          # 读的是 .lighthouseci/lhci.json 的 .results[0].categories。
          # 这里补一份，免得下游永远走「文件不存在，跳过」的死分支。
          node -e '
          const fs = require("fs");
          const dir = ".lighthouseci";
          if (!fs.existsSync(dir)) { console.log("no .lighthouseci dir"); process.exit(0); }
          const files = fs.readdirSync(dir).filter(f => /^lhr-.*\.json$/.test(f)).sort();
          if (!files.length) { console.log("no lhr-*.json, skip"); process.exit(0); }
          const results = files.map(f => JSON.parse(fs.readFileSync(dir + "/" + f, "utf8")));
          fs.writeFileSync(dir + "/lhci.json", JSON.stringify({ results }, null, 2));
          console.log("wrote " + dir + "/lhci.json, runs=" + results.length);
          '

      # ── 报告清单（v18 新增）────────────────────────────────────────────
      # 唯一职责：把「到底写了几个文件、叫什么名字」变成日志里的**事实**。
      # v17 的现场是自相矛盾的两行：
      #   L509  wrote .lighthouseci/lhci.json, runs=1
      #   L525  ##[warning]No files were found with the provided path:
      #         .lighthouseci/. No artifacts will be uploaded.
      # 文件写出来了、artifact 却是空的 —— 没有这份清单，只能靠猜。
      # if: always() ：lhci 步骤红掉时也要看见现场。
      - name: Lighthouse report inventory
        if: always()
        run: |
          echo "──────────── Lighthouse 报告清单 ────────────"
          if [ -d .lighthouseci ]; then
            ls -la .lighthouseci
            echo "文件数: $(find .lighthouseci -maxdepth 1 -type f | wc -l)"
            echo "总体积: $(du -sh .lighthouseci | cut -f1)"
            echo "--- 逐个文件 ---"
            find .lighthouseci -maxdepth 1 -type f -printf '%10s  %p\n' 2>/dev/null \
              | sort -k2 || true
          else
            echo "!! .lighthouseci 目录不存在（lhci collect 没写任何东西）"
          fi
          echo "─────────────────────────────────────────────"

      # ── 可直读的报告（v18 新增）────────────────────────────────────────
      # 光有 lhr-*.json 不算「报告」：那是给程序读的，下载下来打开是一坨 JSON。
      # 这里从 lhci.json 生成一份**零依赖单文件 HTML**（内联样式，不引外网），
      # 随 artifact 一起下载，双击就能看分数、Core Web Vitals、未满分审计。
      # 不调 lighthouse 自带的 report generator —— 那要 `npm i -g lighthouse`
      # 且版本一变 API 就变，又是一条会红的路。
      - name: Generate readable report
        if: always()
        run: |
          node -e '
          const fs = require("fs");
          const p = ".lighthouseci/lhci.json";
          if (!fs.existsSync(p)) {
            console.log("[report] 没有 .lighthouseci/lhci.json，跳过 index.html");
            process.exit(0);
          }
          const r = JSON.parse(fs.readFileSync(p, "utf8")).results[0] || {};
          const cats = r.categories || {};
          const audits = r.audits || {};
          const METRICS = [
            ["first-contentful-paint",   "FCP", 1800, "ms"],
            ["largest-contentful-paint", "LCP", 2500, "ms"],
            ["total-blocking-time",      "TBT",  300, "ms"],
            ["cumulative-layout-shift",  "CLS",  0.1, ""],
            ["speed-index",              "SI",  3400, "ms"],
            ["interactive",              "TTI", 3800, "ms"]
          ];
          const catRows = Object.keys(cats).map(function (k) {
            const c = cats[k];
            const s = c.score == null ? null : Math.round(c.score * 100);
            const cls = s == null ? "na" : s >= 90 ? "good" : s >= 50 ? "avg" : "bad";
            return `  <tr><td>${c.title || k}</td><td class="${cls}">${s == null ? "n/a" : s + "%"}</td></tr>`;
          }).join("\n");
          const metRows = METRICS.map(function (m) {
            const a = audits[m[0]];
            if (!a) return "";
            const v = a.numericValue;
            const shown = v == null ? "n/a"
              : (m[3] === "ms" ? Math.round(v) + " ms" : v.toFixed(3));
            const lim = m[3] === "ms" ? "≤ " + m[2] + " ms" : "≤ " + m[2];
            const bad = v != null && v > m[2];
            return `  <tr><td>${m[1]}</td><td>${shown}</td><td>${lim}</td><td class="${bad ? "bad" : "good"}">${bad ? "超标" : "达标"}</td></tr>`;
          }).join("\n");
          const fails = Object.keys(audits).map(function (k) { return [k, audits[k]]; })
            .filter(function (e) {
              const a = e[1];
              return a && a.score != null && a.score < 1
                && a.scoreDisplayMode !== "informative"
                && a.scoreDisplayMode !== "notApplicable";
            })
            .sort(function (x, y) { return x[1].score - y[1].score; })
            .slice(0, 30);
          const failRows = fails.map(function (e) {
            const a = e[1];
            const disp = a.displayValue ? " (" + a.displayValue + ")" : "";
            return `  <tr><td>${Math.round(a.score * 100)}</td><td>${a.title || e[0]}${disp}</td><td><code>${e[0]}</code></td></tr>`;
          }).join("\n");
          const html = `<!doctype html>
          <html lang="zh-CN"><head><meta charset="utf-8">
          <title>Lighthouse ${r.finalUrl || ""}</title>
          <style>
           body{font:14px/1.65 -apple-system,Segoe UI,system-ui,sans-serif;margin:28px;color:#111;max-width:960px}
           h1{font-size:20px;margin:0 0 4px}h2{font-size:15px;margin:26px 0 8px}
           .meta{color:#555;font-size:12px}
           table{border-collapse:collapse;width:100%;margin:6px 0}
           th,td{border:1px solid #e3e3e3;padding:6px 10px;text-align:left;vertical-align:top}
           th{background:#fafafa;font-weight:600}
           .good{color:#0a7b34;font-weight:600}.avg{color:#b45309;font-weight:600}
           .bad{color:#b91c1c;font-weight:600}.na{color:#888}
           code{font:12px ui-monospace,Consolas,monospace;color:#444}
          </style></head><body>
          <h1>Lighthouse 报告</h1>
          <p class="meta">URL: <code>${r.finalUrl || ""}</code><br>
          采集时间: ${r.fetchTime || "n/a"} &nbsp;|&nbsp; Lighthouse ${r.lighthouseVersion || "n/a"}<br>
          本文件由 CI 在 lhci collect 之后从 lhci.json 生成，随 artifact 下载，双击即可查看。</p>
          <h2>分类得分</h2>
          <table><tr><th>分类</th><th>得分</th></tr>
          ${catRows}
          </table>
          <h2>Core Web Vitals</h2>
          <table><tr><th>指标</th><th>实测</th><th>阈值</th><th>结论</th></tr>
          ${metRows}
          </table>
          <h2>未满分审计（前 30，按得分升序）</h2>
          <table><tr><th>得分</th><th>项目</th><th>audit id</th></tr>
          ${failRows || `  <tr><td colspan="3" class="na">无</td></tr>`}
          </table>
          </body></html>`;
          fs.writeFileSync(".lighthouseci/index.html", html, "utf8");
          console.log("[report] wrote .lighthouseci/index.html, "
            + html.length + " bytes, 未满分审计 " + fails.length + " 条");
          '

      # ── 修 v17「报告是空的」──────────────────────────────────────────────
      # 根因：upload-artifact@v4 的 include-hidden-files 默认 **false**，
      # 而 `.lighthouseci` 的**路径根本身**就是点开头的隐藏目录，于是整棵被
      # 排除 → 明明写了 4 个文件，上传时搜到 0 个。
      # 本文件 L122-127 早就为 `.next/standalone/.next` 记过一模一样的坑，
      # 这处漏了。加 include-hidden-files: true 即可。
      # if-no-files-found: warn —— 真为空时留一条 warning，不静默装绿。
      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-local
          include-hidden-files: true
          if-no-files-found: warn
          path: .lighthouseci/
          retention-days: 7

      - name: Add PR comment
        if: github.event_name == 'pull_request'
        run: |
          if [ -f .lighthouseci/lhr.html ]; then
            echo "::notice::Lighthouse report available at .lighthouseci/lhr.html"
          fi

      - name: Parse Lighthouse results
        if: always()
        run: |
          echo "=== Lighthouse CI Results ==="
          echo "lhci 步骤结论: ${{ steps.lhci.outcome }}"
          if [ "${{ steps.lhci.outcome }}" != "success" ]; then
            {
              echo "### ⚠️ Lighthouse 采集未成功（报告项，不阻断流水线）"
              echo ""
              echo "lhci outcome = ${{ steps.lhci.outcome }}。常见原因："
              echo "standalone server 未在 45s 内监听 :3000，或 runner 上 Chrome 启动失败。"
            } >> "$GITHUB_STEP_SUMMARY"
          fi
          if [ -f .lighthouseci/lhci.json ]; then
            cat .lighthouseci/lhci.json | jq -r '
              .results[0].categories // empty | to_entries[] |
              "  \(.key): \(.value.score * 100 | floor)%" ' 2>/dev/null || true
          fi

          echo ""
          echo "For full report, check the lighthouse-reports-local artifact"

  # ============================================
  # Job 3: Lighthouse CI Audit (Staging)
  # ============================================
  lighthouse-staging:
    name: Lighthouse CI (Staging)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: setup-and-build
    if: github.event_name == 'pull_request' || github.event_name == 'workflow_dispatch'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lighthouse config
        uses: actions/download-artifact@v4
        with:
          name: lighthouserc
          path: .

      - name: Install Lighthouse CI
        # 安装本身容错：指定版本装不上就退 latest，绝不让这一步成为硬门。
        # 原先是裸 `npm install -g @lhci/cli@${{ env.LHCI_VERSION }}`，
        # 版本号一错（v9 就是）整条 job 直接红。
        continue-on-error: true
        run: |
          set -uo pipefail
          echo "target: @lhci/cli@${LHCI_VERSION}"
          if npm install -g "@lhci/cli@${LHCI_VERSION}"; then
            echo "installed @lhci/cli@${LHCI_VERSION}"
            exit 0
          fi
          echo "::warning::@lhci/cli@${LHCI_VERSION} 安装失败，回退 @latest"
          npm install -g @lhci/cli@latest

      - name: Determine target URL
        id: target
        run: |
          if [ "${{ github.event.inputs.url }}" != "" ]; then
            echo "URL=${{ github.event.inputs.url }}" >> $GITHUB_OUTPUT
          elif [ "${{ github.event_name }}" == "pull_request" ]; then
            echo "URL=https://staging.7zi.com" >> $GITHUB_OUTPUT
          else
            echo "URL=https://7zi.com" >> $GITHUB_OUTPUT
          fi

      - name: Run Lighthouse CI against staging
        run: |
          # Update Lighthouse config with correct URL
          TARGET_URL=$(cat << 'EOF'
          http://localhost:3000/
          https://staging.7zi.com/
          EOF
          )

          # Run with static server (lhci static)
          lhci autorun \
            --config=./lighthouserc.json \
            --collect.url="https://staging.7zi.com/" \
            --assert.assertions.categories:performance="off" || true

      - name: Upload Lighthouse reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lighthouse-reports-staging
          # 同 lighthouse-local：点开头目录默认被排除，必须显式打开。
          include-hidden-files: true
          if-no-files-found: warn
          # staging 这跑的是 `lhci autorun`，而 lighthouserc.json 里
          # upload.target=filesystem / outputDir=./lhci_reports，
          # 所以正式报告落在 lhci_reports/，.lighthouseci/ 只剩 manifest。
          # 两个都要，别只传那个只剩清单的。
          path: |
            .lighthouseci/
            lhci_reports/
          retention-days: 7

  # ============================================
  # Job 4: Performance Budget Check
  # ============================================
  performance-budget:
    name: Performance Budget
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: lighthouse-local

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download Lighthouse reports
        uses: actions/download-artifact@v4
        with:
          name: lighthouse-reports-local
          path: .lighthouseci/
        continue-on-error: true

      # artifact 的目录层级取决于 upload-artifact 对单个 path 的 LCA 处理：
      # 有可能平铺成 `.lighthouseci/lhci.json`，也可能保留首段变成
      # `.lighthouseci/.lighthouseci/lhci.json`。两种都接住，别让下游
      # `[ -f .lighthouseci/lhci.json ]` 因为一层目录而恒假。
      - name: Normalize report layout
        if: always()
        run: |
          if [ -f .lighthouseci/.lighthouseci/lhci.json ]; then
            echo "检测到双层嵌套（.lighthouseci/.lighthouseci/），下沉一层"
            cp -a .lighthouseci/.lighthouseci/. .lighthouseci/
            rm -rf .lighthouseci/.lighthouseci
          fi
          echo "--- 归一化后 layout ---"
          find .lighthouseci -maxdepth 2 -type f -printf '%10s  %p\n' 2>/dev/null \
            | sed -n '1,20p' || true

      - name: Check Performance Budget
        run: |
          echo "=== Performance Budget Check ==="
          echo ""
          echo "--- 从 artifact 拿到的文件 ---"
          ls -la .lighthouseci 2>/dev/null || echo "(没有 .lighthouseci 目录)"

          # v17 实测：没报告时这里静默装绿 ——
          #   artifact 空 → download-artifact 只留一条 warning →
          #   本步骤打一句 "skipping budget check" 就 success →
          #   Performance Budget / Audit Summary 两个 job 全绿。
          # 结果就是「报告没了，但流水线一片绿，没人知道」。
          # 现在改成「早退守卫」：明确说「没数据 ≠ 通过」，写进 Step Summary
          # 和预算报告，然后正常退出（exit 0，不判红 —— 报告缺失的火要算在
          # 上游 lighthouse-local 头上，不该在这里连坐）。
          if [ ! -f .lighthouseci/lhci.json ]; then
            echo "::warning::没有 .lighthouseci/lhci.json —— 性能预算无法计算。这是「没有数据」，不是「通过」。"
            {
              echo "### ⚠️ 性能预算未计算：报告缺失"
              echo ""
              echo "lighthouse-local 的 artifact 下来是空的，本 job 拿不到 lhci.json。"
              echo "先看 lighthouse-local 的 **Lighthouse report inventory** 步骤，"
              echo "确认 .lighthouseci 里到底写了几个文件；再看"
              echo "**Upload Lighthouse reports** 那一步（include-hidden-files）。"
            } >> $GITHUB_STEP_SUMMARY
            {
              echo "# Performance Budget Report"
              echo ""
              echo "⚠️ **报告缺失，未能计算预算。**"
              echo ""
              echo "lighthouse-local 的 artifact 为空。这不是「通过」，是「没有数据」。"
              echo ""
              echo "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            } > performance-budget-report.md
            exit 0
          fi

          RESULTS=$(cat .lighthouseci/lhci.json)

          # ── 取值 helper ──────────────────────────────────────────────────
          # 两个必须踩的坑（v18 用假 lhci.json 自测出来；之前一直没暴露，
          # 因为 artifact 恒空、下面整段死分支从来没真正跑过）：
          #  1) jq 里 `.categories.best-practices` 会被解析成 best **减** practices
          #     → null → 恒打印 "N/A%"。必须写 .categories["best-practices"]。
          #  2) `[ "$LCP" -gt 2500 ]` 只吃整数，而 numericValue 是 3964.9474
          #     这种浮点 → `[: 3964.9474: integer expected` 报错。比较一律走 awk。
          num()   { echo "$RESULTS" | jq -r ".results[0].audits[\"$1\"].numericValue // \"N/A\"" 2>/dev/null || echo "N/A"; }
          cat_s() { echo "$RESULTS" | jq -r ".results[0].categories[\"$1\"].score * 100 | floor" 2>/dev/null || echo "N/A"; }
          cmp()   { # $1=值 $2=ge|le $3=阈值 → PASS / FAIL / N/A
            if [ -z "$1" ] || [ "$1" = "N/A" ] || [ "$1" = "null" ]; then echo "N/A"; return 0; fi
            awk -v v="$1" -v t="$3" -v op="$2" 'BEGIN{
              if (op == "ge") print (v + 0 >= t + 0) ? "PASS" : "FAIL";
              else            print (v + 0 <= t + 0) ? "PASS" : "FAIL";
            }'
          }
          ms()    { if [ -z "$1" ] || [ "$1" = "N/A" ]; then echo "N/A"; else awk -v v="$1" 'BEGIN{printf "%.0f", v}'; fi; }
          # CLS 是无量纲小数，原始值长这样：0.009720534629404616。
          # 直接 ${CLS} 打印会把预算表撑满一行，人眼抓不到量级 → 一律 3 位。
          f3()    { if [ -z "$1" ] || [ "$1" = "N/A" ] || [ "$1" = "null" ]; then echo "N/A"; else awk -v v="$1" 'BEGIN{printf "%.3f", v}'; fi; }

          PERF_SCORE=$(cat_s performance)
          A11Y_SCORE=$(cat_s accessibility)
          BP_SCORE=$(cat_s best-practices)
          SEO_SCORE=$(cat_s seo)
          LCP=$(num largest-contentful-paint)
          CLS=$(num cumulative-layout-shift)
          FCP=$(num first-contentful-paint)
          TBT=$(num total-blocking-time)

          echo "📊 Category Scores:"
          echo "==================="
          echo "  Performance:     ${PERF_SCORE}%  (threshold: >= 80%)  $(cmp "$PERF_SCORE" ge 80)"
          echo "  Accessibility:   ${A11Y_SCORE}%  (threshold: >= 85%)  $(cmp "$A11Y_SCORE" ge 85)"
          echo "  Best Practices:  ${BP_SCORE}%  (threshold: >= 85%)  $(cmp "$BP_SCORE" ge 85)"
          echo "  SEO:             ${SEO_SCORE}%  (threshold: >= 85%)  $(cmp "$SEO_SCORE" ge 85)"
          echo ""

          echo "⚡ Core Web Vitals:"
          echo "==================="
          echo "  LCP:  $(ms "$LCP")ms  (threshold: <= 2500ms)  $(cmp "$LCP" le 2500)"
          echo "  CLS:  $(f3 "$CLS")  (threshold: <= 0.1)  $(cmp "$CLS" le 0.1)"
          echo "  FCP:  $(ms "$FCP")ms  (threshold: <= 1800ms)  $(cmp "$FCP" le 1800)"
          echo "  TBT:  $(ms "$TBT")ms  (threshold: <= 300ms)  $(cmp "$TBT" le 300)"
          echo ""

          # Check thresholds
          FAILED=0

          if [ "$(cmp "$PERF_SCORE" ge 80)" = "FAIL" ]; then
            echo "❌ Performance score below threshold!"; FAILED=1
          fi
          if [ "$(cmp "$LCP" le 2500)" = "FAIL" ]; then
            echo "❌ LCP above threshold!"; FAILED=1
          fi
          if [ "$(cmp "$TBT" le 300)" = "FAIL" ]; then
            echo "❌ TBT above threshold!"; FAILED=1
          fi
          if [ "$(cmp "$CLS" le 0.1)" = "FAIL" ]; then
            echo "❌ CLS above threshold!"; FAILED=1
          fi

          # 预算只报告、不判红。理由：这套阈值（perf>=80 / LCP<=2500ms /
          # CLS<=0.1）从来没通过过 —— 因为 server 一直起不来，根本没人见过
          # 真实数字。拿到第一份可信基线之前，红灯只是噪音。
          # 等基线稳定、确认阈值合理，再把 warning 改回 exit 1。
          if [ $FAILED -eq 1 ]; then
            echo "::warning::Performance budget exceeded (report-only)"
            echo "### ⚠️ 性能预算超出（仅报告，不阻断）" >> $GITHUB_STEP_SUMMARY
          else
            echo "✅ Performance budget check PASSED"
            echo "### ✅ 性能预算通过" >> $GITHUB_STEP_SUMMARY
          fi

          # ── 落一份人能读的预算报告（v18）────────────────────────────────
          # 原来是另一个步骤用 heredoc 写了个**只有表头的空表**：
          #     | Metric | Value | Threshold | Status |
          # 下载 artifact 打开什么都看不到 —— 又一个「报告在哪」的来源。
          # 这里把真实数值填进去。
          URL=$(echo "$RESULTS" | jq -r '.results[0].finalUrl // "n/a"' 2>/dev/null || echo "n/a")
          FETCHED=$(echo "$RESULTS" | jq -r '.results[0].fetchTime // "n/a"' 2>/dev/null || echo "n/a")
          {
            echo "# Performance Budget Report"
            echo ""
            echo "- URL: \`${URL}\`"
            echo "- 采集时间: ${FETCHED}"
            echo "- 模式: **report-only**（超预算只告警，不判红流水线）"
            echo ""
            echo "## Summary"
            echo ""
            echo "| Metric | Value | Threshold | Status |"
            echo "|--------|-------|-----------|--------|"
            echo "| Performance | ${PERF_SCORE}% | >= 80% | $(cmp "$PERF_SCORE" ge 80) |"
            echo "| Accessibility | ${A11Y_SCORE}% | >= 85% | $(cmp "$A11Y_SCORE" ge 85) |"
            echo "| Best Practices | ${BP_SCORE}% | >= 85% | $(cmp "$BP_SCORE" ge 85) |"
            echo "| SEO | ${SEO_SCORE}% | >= 85% | $(cmp "$SEO_SCORE" ge 85) |"
            echo "| LCP | $(ms "$LCP") ms | <= 2500 ms | $(cmp "$LCP" le 2500) |"
            echo "| FCP | $(ms "$FCP") ms | <= 1800 ms | $(cmp "$FCP" le 1800) |"
            echo "| TBT | $(ms "$TBT") ms | <= 300 ms | $(cmp "$TBT" le 300) |"
            echo "| CLS | $(f3 "$CLS") | <= 0.1 | $(cmp "$CLS" le 0.1) |"
            echo ""
            if [ $FAILED -eq 1 ]; then
              echo "> ⚠️ 有指标超出预算。当前为 **report-only**（只告警不阻断），"
              echo "> 阈值与真实基线的差距本身就是待办的性能债。"
            else
              echo "> ✅ 全部指标在预算内。"
            fi
            echo ""
            echo "完整报告（含逐条审计）见 artifact **lighthouse-reports-local** 里的 \`index.html\`。"
            echo ""
            echo "Generated at: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          } > performance-budget-report.md
          echo "--- performance-budget-report.md ---"
          cat performance-budget-report.md

      # 原来的 `Generate budget report` 已并入上一脚本 —— 它写的是一份
      # **只有表头的空表**，还会把上面填好真实数值的文件覆盖掉。
      # 这里只留一个「报告真的生成了吗」的自检，免得哪天又静默变回空文件。
      - name: Verify budget report
        if: always()
        run: |
          if [ ! -s performance-budget-report.md ]; then
            echo "::warning::performance-budget-report.md 缺失或为空，补一份占位说明"
            printf '# Performance Budget Report\n\n⚠️ 未生成（上游脚本异常），请看 workflow 日志。\n' \
              > performance-budget-report.md
          fi
          echo "performance-budget-report.md 字节数: $(wc -c < performance-budget-report.md)"

      - name: Upload budget report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: performance-budget-report
          if-no-files-found: warn
          path: performance-budget-report.md
          retention-days: 30

  # ============================================
  # Job 5: Generate Summary
  # ============================================
  summary:
    name: Audit Summary
    runs-on: ubuntu-latest
    timeout-minutes: 5
    needs: [lighthouse-local, lighthouse-staging, performance-budget]
    if: always()

    steps:
      - name: Generate Summary
        run: |
          echo "## 🚀 Performance Audit Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          # 原来写死 `github.event.inputs.url || 'https://staging.7zi.com'`：
          # push / pull_request 事件下 inputs 是空的，于是永远显示 staging，
          # 与实际跑的 http://127.0.0.1:3000/（standalone 本地构建）不符。
          echo "**Target:** \`${{ github.event.inputs.url || 'http://127.0.0.1:3000/ (standalone build)' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📦 报告在哪" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "本 run 的 **Artifacts** 区（页面最下方）：" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Artifact | 内容 |" >> $GITHUB_STEP_SUMMARY
          echo "|----------|------|" >> $GITHUB_STEP_SUMMARY
          echo "| \`lighthouse-reports-local\` | \`index.html\`（可直接打开看分数）、\`lhr-*.json\`（原始 LHR）、\`lhci.json\`（归一化）、\`manifest.json\` |" >> $GITHUB_STEP_SUMMARY
          echo "| \`performance-budget-report\` | \`performance-budget-report.md\`（预算对照表） |" >> $GITHUB_STEP_SUMMARY
          echo "| \`lighthouse-reports-staging\` | 仅 PR / 手动触发时存在 |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          echo "### Job Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Local | \`${{ needs.lighthouse-local.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Lighthouse Staging | \`${{ needs.lighthouse-staging.result || 'skipped' }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "| Performance Budget | \`${{ needs.performance-budget.result }}\` |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY

          # Overall status
          if [ "${{ needs.lighthouse-local.result }}" == "success" ] && \
             [ "${{ needs.performance-budget.result }}" == "success" ]; then
            echo "### ✅ All Performance Audits Passed!" >> $GITHUB_STEP_SUMMARY
          else
            echo "### ⚠️ Some Performance Checks Failed" >> $GITHUB_STEP_SUMMARY
            echo "" >> $GITHUB_STEP_SUMMARY
            echo "Check the individual job logs for details." >> $GITHUB_STEP_SUMMARY
          fi

# ============================================
# Notes
# ============================================
#
# To enable full Lighthouse CI functionality:
# 1. Add lighthouse as a dependency: pnpm add -D lighthouse
# 2. Install Playwright browsers: npx playwright install --with-deps chromium
# 3. Ensure the application builds successfully before running audits
#
# For local development testing:
#   npm run start &
#   npx lighthouse http://localhost:3000 --output=html --output-path=./lighthouse-report.html
#
# For CI/CD integration:
#   - This workflow runs automatically on PRs to main/develop
#   - It will block deployments if performance regresses
#   - Artifacts are available for debugging
#
# ============================================
