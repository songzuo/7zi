# ============================================
# Security Scan Workflow —— 每日体检，只报告、默认不判红
# ============================================
#
# 历史教训（2026-10-26 修）：
#   本文件曾用名 security-scan.yml。自 2026-03-21 注册起，container job 的
#   job 级 if 里写了 hashFiles('Dockerfile', 'Dockerfile.optimized')，
#   而 hashFiles() 不允许出现在 jobs.<id>.if 中。GitHub 在**解析阶段**就报：
#     (Line: 180, Col: 9): Unrecognized function: 'hashFiles'.
#   后果：整份 workflow 解析失败 —— 注册表里 name 回落成文件路径、
#   jobs.total_count = 0、每次 push 都产生一个 0 job 的 failure run
#   （每次 push 一封失败邮件），而 schedule 反而一次都没真正跑过。
#   修法：job 级探测改成 step 级探测（Detect Dockerfile）。
#
# 另一个坑：workflow_dispatch 的 input 名里带连字符（scan-type / fail-on-issues）
#   在表达式里会被解析成减法，一律改成下划线。
#
# 设计取舍：
#   - 定时跑（schedule）只写 Step Summary + 上传 artifact，**永不判红**，
#     避免把「每日漏洞报告」变成「每日失败邮件」。
#   - 需要严格判红时，手动 Run workflow 并把 fail_on_issues 设为 true。
#   - 不再自动建 issue（建 issue 也会发邮件）。
# ============================================

name: Security Scan

on:
  # 每天 UTC 02:00
  schedule:
    - cron: '0 2 * * *'
  # 手动触发
  workflow_dispatch:
    inputs:
      scan_type:
        description: 'Scan type'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - dependencies
          - secrets
          - code
      fail_on_issues:
        description: 'Fail the run when issues are found (manual runs only)'
        required: false
        default: false
        type: boolean

env:
  NODE_VERSION: '22'

permissions:
  contents: read
  security-events: write

jobs:
  # ============================================
  # Job 1: 依赖漏洞扫描
  # ============================================
  dependencies:
    name: Dependency Vulnerabilities
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      # secrets 不能直接出现在 if: 里（GitHub 限制，GITHUB_TOKEN 除外），
      # 先落到 env 再用 env.SNYK_TOKEN 判断。
      SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: npm audit
        id: audit
        continue-on-error: true
        run: |
          set +e
          npm audit --audit-level=high > npm-audit.txt 2>&1
          echo "--- npm audit（尾部 60 行）---"
          tail -n 60 npm-audit.txt || true
          if grep -qE "critical|high" npm-audit.txt; then
            echo "has_vulnerabilities=true" >> "$GITHUB_OUTPUT"
            echo "::warning::npm audit 发现 critical/high 漏洞，详见 npm-audit-results artifact"
          else
            echo "has_vulnerabilities=false" >> "$GITHUB_OUTPUT"
            echo "npm audit: 无 critical/high 漏洞"
          fi
          exit 0

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-results
          path: npm-audit.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Snyk scan
        if: ${{ (github.event_name == 'schedule' || inputs.scan_type == 'all' || inputs.scan_type == 'dependencies') && env.SNYK_TOKEN != '' }}
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          args: --severity-threshold=high

      - name: Dependency scan summary
        if: always()
        run: |
          {
            echo "## 🔍 Dependency Security Scan"
            echo ""
            echo "| Scan | Result |"
            echo "|------|--------|"
            echo "| npm audit | has_vulnerabilities=${{ steps.audit.outputs.has_vulnerabilities }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Job 2: 秘钥扫描
  # ============================================
  secrets:
    name: Secret Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: TruffleHog Secret Scan
        if: ${{ github.event_name == 'schedule' || inputs.scan_type == 'all' || inputs.scan_type == 'secrets' }}
        uses: trufflesecurity/trufflehog@main
        continue-on-error: true
        with:
          path: ./
          extra_args: --only-verified

      - name: Secret scan summary
        if: always()
        run: |
          {
            echo "## 🔐 Secret Scan"
            echo ""
            echo "TruffleHog（--only-verified）已执行，命中结果见本 job 日志。"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Job 3: 代码安全扫描
  # ============================================
  code:
    name: Code Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Run ESLint with security rules
        if: ${{ github.event_name == 'schedule' || inputs.scan_type == 'all' || inputs.scan_type == 'code' }}
        continue-on-error: true
        run: npm run lint -- --format json --output-file eslint-report.json || true

      - name: Check for security issues
        if: always()
        continue-on-error: true
        run: |
          if [ ! -s eslint-report.json ]; then
            echo "eslint-report.json 不存在或为空，跳过统计" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          SECURITY_ISSUES=$(jq -r '[.[] | select(.messages[]? | .ruleId | tostring | test("security"))] | length' eslint-report.json 2>/dev/null || echo 0)
          {
            echo "## 🔍 Code Security Issues"
            echo ""
            echo "- 与 security 相关的 lint 问题：$SECURITY_ISSUES"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "${SECURITY_ISSUES:-0}" -gt 0 ] 2>/dev/null; then
            echo "::warning::Found $SECURITY_ISSUES security-related issues"
          fi
          exit 0

      - name: Upload ESLint report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eslint-security-report
          path: eslint-report.json
          retention-days: 30
          if-no-files-found: ignore

  # ============================================
  # Job 4: 容器镜像扫描（仅当仓库里有 Dockerfile）
  #   注意：探测必须放在 step 里。hashFiles() 在 job 级 if 会直接让整个
  #   workflow 解析失败，这是本文件从 2026-03 起一直失败的根因。
  # ============================================
  container:
    name: Container Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Detect Dockerfile
        id: df
        run: |
          if [ -f Dockerfile.optimized ]; then
            echo "file=Dockerfile.optimized" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          elif [ -f Dockerfile ]; then
            echo "file=Dockerfile" >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "found=false" >> "$GITHUB_OUTPUT"
            echo "仓库里没有 Dockerfile，跳过容器扫描" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Set up Docker Buildx
        if: steps.df.outputs.found == 'true'
        uses: docker/setup-buildx-action@v3

      # 这条构建从 2026-03 起一直失败，根因在 .dockerignore 把 tsconfig.json
      # 排除出了构建上下文（→ 镜像内 422 条 Module not found）。.dockerignore
      # 已修（2026-10-26）。但为了不再把「每日漏洞报告」变成「每日失败邮件」，
      # 这里仍降级为报告项：构建红了只出警告 + Step Summary，不判红流水线。
      # 观察几天确认镜像能稳定构建后，再把 continue-on-error 去掉。
      - name: Build test image
        id: build
        if: steps.df.outputs.found == 'true'
        continue-on-error: true
        run: docker build -t 7zi-test:latest -f "${{ steps.df.outputs.file }}" .

      - name: Run Trivy vulnerability scanner
        # 镜像没构建出来就没有可扫的东西；不跳过只会得到一条
        # 「image not found」的纯噪音失败。
        if: steps.df.outputs.found == 'true' && steps.build.outcome == 'success'
        uses: aquasecurity/trivy-action@master
        continue-on-error: true
        with:
          image-ref: '7zi-test:latest'
          format: 'sarif'
          output: 'trivy-results.sarif'
          severity: 'CRITICAL,HIGH'

      - name: Upload Trivy results to GitHub Security tab
        if: steps.df.outputs.found == 'true' && steps.build.outcome == 'success'
        uses: github/codeql-action/upload-sarif@v3
        continue-on-error: true
        with:
          sarif_file: 'trivy-results.sarif'

      - name: Container scan summary
        if: always()
        run: |
          {
            echo "## 🐳 Container Security Scan"
            echo ""
            echo "Dockerfile: ${{ steps.df.outputs.file }}（found=${{ steps.df.outputs.found }}）"
            echo ""
            echo "| 步骤 | 结论 |"
            echo "|------|------|"
            echo "| 镜像构建 | ${{ steps.build.outcome }} |"
          } >> "$GITHUB_STEP_SUMMARY"

  # ============================================
  # Job 5: 安全报告汇总
  # ============================================
  report:
    name: Security Report
    runs-on: ubuntu-latest
    needs: [dependencies, secrets, code, container]
    if: always()
    steps:
      - name: Create security summary
        run: |
          {
            echo "## 🔒 Security Scan Report"
            echo ""
            echo "| Scan | Result |"
            echo "|------|--------|"
            echo "| Dependencies | ${{ needs.dependencies.result }} |"
            echo "| Secrets | ${{ needs.secrets.result }} |"
            echo "| Code | ${{ needs.code.result }} |"
            echo "| Container | ${{ needs.container.result }} |"
            echo ""
            echo "Artifacts: npm-audit-results / eslint-security-report / trivy-results.sarif"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: 只有显式要求时才判红
        if: ${{ github.event_name == 'workflow_dispatch' && (inputs.fail_on_issues == true || inputs.fail_on_issues == 'true') && contains(needs.*.result, 'failure') }}
        run: |
          echo "::error::安全扫描有 job 失败，且 fail_on_issues=true，按要求判红"
          exit 1
