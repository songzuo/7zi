# ============================================
# 7zi-frontend CI/CD Pipeline (Optimized v2)
# 特性：
# - 并行测试矩阵
# - 增量构建缓存
# - Docker 层缓存
# - 零停机部署
# - 自动回滚
# ============================================

name: CI/CD Pipeline v2

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      strategy:
        description: 'Deployment strategy'
        required: true
        default: 'blue-green'
        type: choice
        options:
          - blue-green
          - rolling

# 并发控制
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: '22'
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # ============================================
  # Job 1: 代码质量检查（并行）
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Run ESLint
        run: npm run lint
      
      - name: Check formatting
        run: npm run format:check
        continue-on-error: true

  # ============================================
  # Job 2: TypeScript 类型检查（并行）
  # ============================================
  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: TypeScript check
        run: npm run type-check

  # ============================================
  # Job 3: 单元测试（并行矩阵）
  # ============================================
  test:
    name: Test (shard ${{ matrix.shard }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Run tests
        run: npm run test:run -- --shard=${{ matrix.shard }}/4
        
      - name: Upload coverage
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/
          retention-days: 7

  # ============================================
  # Job 4: 构建
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint, typecheck, test]
    outputs:
      build-hash: ${{ steps.build-info.outputs.hash }}
      build-size: ${{ steps.build-info.outputs.size }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'
      
      # 增量构建缓存
      - name: Cache Next.js build
        uses: actions/cache@v4
        with:
          path: |
            .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            nextjs-${{ runner.os }}-
      
      - name: Install dependencies
        run: npm ci --prefer-offline
      
      - name: Build application
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production
      
      - name: Build info
        id: build-info
        run: |
          echo "hash=${{ github.sha }}" >> $GITHUB_OUTPUT
          echo "size=$(du -sm .next/standalone | cut -f1)" >> $GITHUB_OUTPUT
          echo "📊 Build size: $(du -sm .next/standalone | cut -f1)MB"
      
      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

  # ============================================
  # Job 5: Docker 构建（main 分支）
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build]
    if: github.ref == 'refs/heads/main'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      
      # Docker 层缓存
      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile.optimized', '**/package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            docker-${{ runner.os }}-${{ hashFiles('Dockerfile.optimized', '**/package-lock.json') }}-
            docker-${{ runner.os }}-
      
      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}
      
      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.optimized
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
      
      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

  # ============================================
  # Job 6: 部署到 Staging
  # ============================================
  deploy-staging:
    name: Deploy Staging
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.7zi.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      
      - name: Deploy with zero-downtime
        env:
          SSH_HOST: ${{ secrets.STAGING_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASS: ${{ secrets.DEPLOY_PASS }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'ENDSSH'
            cd /opt/7zi-frontend
            
            echo "🚀 Starting staging deployment..."
            
            # 拉取最新代码
            git pull origin main
            
            # 执行零停机部署
            chmod +x deploy-zero-downtime.sh
            ./deploy-zero-downtime.sh deploy
            
            echo "✅ Staging deployment complete"
          ENDSSH

  # ============================================
  # Job 7: 部署到 Production（手动触发）
  # ============================================
  deploy-production:
    name: Deploy Production
    runs-on: ubuntu-latest
    needs: [docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && inputs.environment == 'production'
    environment:
      name: production
      url: https://7zi.com
    steps:
      - uses: actions/checkout@v4
      
      - name: Install sshpass
        run: sudo apt-get install -y sshpass
      
      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "v$(date +%Y%m%d-%H%M%S)" -m "Release $(date +%Y-%m-%d)"
          git push origin --tags || true
      
      - name: Deploy with zero-downtime
        env:
          SSH_HOST: ${{ secrets.PRODUCTION_HOST }}
          SSH_USER: ${{ secrets.DEPLOY_USER }}
          SSH_PASS: ${{ secrets.DEPLOY_PASS }}
          DEPLOY_STRATEGY: ${{ inputs.strategy }}
        run: |
          sshpass -p "$SSH_PASS" ssh -o StrictHostKeyChecking=no $SSH_USER@$SSH_HOST << 'ENDSSH'
            cd /opt/7zi-frontend
            
            echo "🚀 Starting production deployment..."
            echo "Strategy: ${DEPLOY_STRATEGY:-blue-green}"
            
            # 备份
            BACKUP_DIR="/opt/backups/7zi-frontend-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r .next "$BACKUP_DIR/" 2>/dev/null || true
            
            # 拉取最新代码
            git pull origin main
            
            # 执行部署
            chmod +x deploy-zero-downtime.sh
            if [ "${DEPLOY_STRATEGY}" = "rolling" ]; then
              ./deploy-zero-downtime.sh rolling
            else
              ./deploy-zero-downtime.sh deploy
            fi
            
            # 清理旧备份
            ls -dt /opt/backups/7zi-frontend-* | tail -n +6 | xargs -r rm -rf
            
            echo "✅ Production deployment complete"
          ENDSSH
      
      - name: Verify deployment
        run: |
          echo "Verifying deployment..."
          for i in {1..10}; do
            if curl -sf https://7zi.com/api/health > /dev/null 2>&1; then
              echo "✅ Production is healthy"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "❌ Health check failed"
          exit 1

  # ============================================
  # Job 8: 失败通知
  # ============================================
  notify-failure:
    name: Notify Failure
    runs-on: ubuntu-latest
    needs: [build, deploy-staging, deploy-production]
    if: failure()
    steps:
      - name: Send notification
        run: |
          echo "❌ CI/CD Pipeline failed!"
          echo "Repository: ${{ github.repository }}"
          echo "Branch: ${{ github.ref_name }}"
          echo "Commit: ${{ github.sha }}"
          echo "Actor: ${{ github.actor }}"
          # 可以添加 Slack/Telegram/Email 通知
