# ============================================
# 7zi-frontend CI/CD Pipeline (Optimized v4)
# 特性：
# - 智能缓存策略（Next.js turbo + Docker layers）
# - 并行测试矩阵（单元 + E2E 多浏览器）
# - 基于变更的智能测试选择
# - 全面的安全审计
# - 自动化部署与回滚
# - 性能监控与告警
# ============================================

name: CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      environment:
        description: 'Deployment environment'
        required: true
        default: 'staging'
        type: choice
        options:
          - staging
          - production
      skip-tests:
        description: 'Skip tests (not recommended)'
        required: false
        default: false
        type: boolean
      run-full-scan:
        description: 'Run full security scan'
        required: false
        default: false
        type: boolean

# 并发控制 - 取消旧的运行
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # 统一 Node.js 版本（与 package.json 一致）
  NODE_VERSION: '22'
  # Docker 镜像仓库
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # 部署服务器
  STAGING_HOST: ${{ secrets.STAGING_HOST }}
  PRODUCTION_HOST: ${{ secrets.PRODUCTION_HOST }}

jobs:
  # ============================================
  # Job 1: 变更检测与智能测试选择
  # ============================================
  changes:
    name: Detect Changes
    runs-on: ubuntu-latest
    outputs:
      src-changed: ${{ steps.changes.outputs.src }}
      tests-changed: ${{ steps.changes.outputs.tests }}
      config-changed: ${{ steps.changes.outputs.config }}
      has-changes: ${{ steps.changes.outputs.any_changed }}
    steps:
      - uses: actions/checkout@v4

      - name: Get changed files
        id: changes
        uses: tj-actions/changed-files@v45
        with:
          files: |
            src/**/*.{ts,tsx,js,jsx}
            tests/**/*.{ts,tsx,js,jsx}
            e2e/**/*.spec.ts
            **/package.json
            **/Dockerfile*
            **/*.config.*

  # ============================================
  # Job 2: 依赖安装与缓存（统一）
  # ============================================
  setup:
    name: Setup & Cache
    runs-on: ubuntu-latest
    outputs:
      cache-key: ${{ steps.cache-keys.outputs.key }}
      cache-hit: ${{ steps.cache.outputs.cache-hit }}
    steps:
      - uses: actions/checkout@v4

      - name: Generate cache keys
        id: cache-keys
        run: |
          echo "key=npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Cache node modules
        id: cache
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ steps.cache-keys.outputs.key }}
          restore-keys: |
            npm-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}-
            npm-${{ runner.os }}-

      - name: Install dependencies
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          echo "📦 Installing dependencies..."
          npm ci --prefer-offline --legacy-peer-deps
          echo "✅ Dependencies installed"

      - name: Cache Next.js turbo
        uses: actions/cache@v4
        with:
          path: |
            .turbo
            .next/cache
          key: nextjs-turbo-${{ runner.os }}-${{ steps.cache-keys.outputs.key }}-${{ github.sha }}
          restore-keys: |
            nextjs-turbo-${{ runner.os }}-${{ steps.cache-keys.outputs.key }}-
            nextjs-turbo-${{ runner.os }}-

  # ============================================
  # Job 3: 安全扫描（并行）
  # ============================================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    needs: [setup]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      # npm audit（不应该失败）
      - name: npm audit
        run: |
          echo "🔍 Running npm audit..."
          npm audit --audit-level=moderate || echo "⚠️ Vulnerabilities found (non-blocking)"

      # 依赖安全扫描（可选，需要 Snyk token）
      - name: Snyk security scan
        if: github.event.inputs.run-full-scan == 'true' || github.ref == 'refs/heads/main'
        uses: snyk/actions/node@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}

      # 秘钥扫描
      - name: TruffleHog Secret Scan
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD

      - name: Security summary
        run: |
          echo "## 🔒 Security Scan Results" >> $GITHUB_STEP_SUMMARY
          echo "- npm audit: Completed" >> $GITHUB_STEP_SUMMARY
          echo "- Snyk scan: ${{ github.event.inputs.run-full-scan == 'true' && 'Completed' || 'Skipped' }}" >> $GITHUB_STEP_SUMMARY
          echo "- Secret scan: Completed" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 4: 代码质量检查（并行）
  # ============================================
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: needs.changes.outputs.src-changed == 'true' || needs.changes.outputs.config-changed == 'true'
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Run ESLint
        run: |
          echo "🔍 Running ESLint..."
          npm run lint

      - name: Check formatting
        run: |
          echo "🎨 Checking formatting..."
          npm run format:check
        continue-on-error: true

      - name: Type check
        run: |
          echo "📝 Running TypeScript check..."
          npm run type-check

  # ============================================
  # Job 5: 单元测试（并行矩阵）
  # ============================================
  test-unit:
    name: Unit Tests (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    needs: [setup, changes]
    if: needs.changes.outputs.src-changed == 'true' || needs.changes.outputs.tests-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Run unit tests
        run: |
          echo "🧪 Running unit tests (shard ${{ matrix.shard }}/4)..."
          npm run test:run -- --shard=${{ matrix.shard }}/4 --coverage

      - name: Upload coverage (shard 1)
        if: matrix.shard == 1
        uses: actions/upload-artifact@v4
        with:
          name: coverage-unit
          path: coverage/
          retention-days: 7

      - name: Upload coverage to Codecov
        if: matrix.shard == 1
        uses: codecov/codecov-action@v4
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

  # ============================================
  # Job 6: E2E 测试（并行矩阵）
  # ============================================
  test-e2e:
    name: E2E Tests (${{ matrix.browser }})
    runs-on: ubuntu-latest
    needs: [setup, lint, changes]
    if: (github.event_name == 'pull_request' || github.ref == 'refs/heads/main') && needs.changes.outputs.src-changed == 'true'
    strategy:
      fail-fast: false
      matrix:
        browser: [chromium, firefox]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}
          restore-keys: |
            playwright-${{ runner.os }}-

      - name: Install Playwright browsers
        run: npx playwright install --with-deps ${{ matrix.browser }}

      - name: Build application
        run: |
          echo "🏗️ Building application..."
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Run E2E tests
        run: |
          echo "🧪 Running E2E tests (${{ matrix.browser }})..."
          npm run test:e2e -- --project=${{ matrix.browser }}
        env:
          CI: true

      - name: Upload Playwright report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report-${{ matrix.browser }}
          path: |
            playwright-report/
            test-results/
          retention-days: 7

      - name: Upload screenshots on failure
        uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-screenshots-${{ matrix.browser }}
          path: test-results/
          retention-days: 7

  # ============================================
  # Job 7: 构建（缓存优化）
  # ============================================
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [setup, lint, test-unit]
    outputs:
      build-hash: ${{ steps.build-info.outputs.hash }}
      build-size: ${{ steps.build-info.outputs.size }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --prefer-offline --legacy-peer-deps

      - name: Build application
        run: |
          echo "🏗️ Building application..."
          npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          NODE_ENV: production

      # 构建分析
      - name: Analyze build
        id: build-info
        run: |
          echo "📊 Build Analysis"
          echo "=================="
          TOTAL_SIZE=$(du -sm .next/ | cut -f1)
          echo "Total .next/: ${TOTAL_SIZE}MB"

          if [ -d .next/standalone ]; then
            STANDALONE_SIZE=$(du -sm .next/standalone | cut -f1)
            echo "Standalone: ${STANDALONE_SIZE}MB"
            echo "size=${STANDALONE_SIZE}" >> $GITHUB_OUTPUT
          else
            echo "size=0" >> $GITHUB_OUTPUT
          fi

          echo "hash=${{ github.sha }}" >> $GITHUB_OUTPUT

          # 检查构建大小
          if [ "${{ steps.build-info.outputs.size }}" -gt 300 ]; then
            echo "::warning::Build size exceeds 300MB"
          fi

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build
          path: |
            .next/standalone
            .next/static
            public
          retention-days: 1

      - name: Build summary
        run: |
          echo "## 🏗️ Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Metric | Value |" >> $GITHUB_STEP_SUMMARY
          echo "|--------|-------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build Size | ${{ steps.build-info.outputs.size }}MB |" >> $GITHUB_STEP_SUMMARY
          echo "| Build Hash | \`${{ steps.build-info.outputs.hash }}\` |" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 8: Docker 构建（main 分支）
  # ============================================
  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: [build, security]
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    outputs:
      image-tag: ${{ steps.meta.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Cache Docker layers
        uses: actions/cache@v4
        with:
          path: /tmp/.buildx-cache
          key: docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'package.json', 'package-lock.json') }}-${{ github.sha }}
          restore-keys: |
            docker-${{ runner.os }}-${{ hashFiles('Dockerfile', 'package.json', 'package-lock.json') }}-
            docker-${{ runner.os }}-

      - name: Login to Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=sha,prefix=
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile.optimized
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=local,src=/tmp/.buildx-cache
          cache-to: type=local,dest=/tmp/.buildx-cache-new,mode=max
          build-args: |
            NEXT_TELEMETRY_DISABLED=1
        continue-on-error: true

      - name: Move cache
        run: |
          rm -rf /tmp/.buildx-cache
          mv /tmp/.buildx-cache-new /tmp/.buildx-cache

      - name: Docker summary
        run: |
          echo "## 🐳 Docker Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tag | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | while read tag; do
            echo "| \`${tag}\` | ✅ Built |" >> $GITHUB_STEP_SUMMARY
          done

  # ============================================
  # Job 9: 部署到 Staging（自动）
  # ============================================
  deploy-staging:
    name: Deploy to Staging
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    environment:
      name: staging
      url: https://staging.7zi.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.STAGING_HOST }} >> ~/.ssh/known_hosts

      - name: Deploy to staging
        run: |
          echo "🚀 Deploying to staging..."

          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ env.STAGING_HOST }} << 'ENDSSH'
            set -e
            cd /opt/7zi-frontend

            echo "Pulling latest code..."
            git pull origin main

            echo "Building and deploying..."
            if [ -f deploy-zero-downtime.sh ]; then
              chmod +x deploy-zero-downtime.sh
              ./deploy-zero-downtime.sh deploy
            else
              docker-compose -f docker-compose.prod.yml pull
              docker-compose -f docker-compose.prod.yml up -d --no-deps --build
            fi

            echo "Waiting for health check..."
            sleep 15
            for i in {1..5}; do
              if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ Staging deployment successful!"
                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 5
            done

            echo "❌ Health check failed!"
            exit 1
          ENDSSH

      - name: Staging deployment summary
        run: |
          echo "## 🚀 Staging Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: https://staging.7zi.com" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 10: 部署到 Production（手动触发）
  # ============================================
  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [build, docker]
    if: github.ref == 'refs/heads/main' && github.event_name == 'workflow_dispatch' && github.event.inputs.environment == 'production'
    environment:
      name: production
      url: https://7zi.com
    steps:
      - uses: actions/checkout@v4

      - name: Setup SSH
        uses: webfactory/ssh-agent@v0.8.0
        with:
          ssh-private-key: ${{ secrets.SSH_PRIVATE_KEY }}

      - name: Add server to known hosts
        run: |
          mkdir -p ~/.ssh
          ssh-keyscan -H ${{ env.PRODUCTION_HOST }} >> ~/.ssh/known_hosts

      - name: Create release tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          RELEASE_TAG="v$(date +%Y%m%d-%H%M%S)"
          git tag -a "$RELEASE_TAG" -m "Release $(date +%Y-%m-%d) - $RELEASE_TAG"
          git push origin --tags || true
          echo "🏷️ Created release tag: $RELEASE_TAG"

      - name: Deploy to production
        run: |
          echo "🚀 Deploying to production..."

          ssh -o StrictHostKeyChecking=no ${{ secrets.DEPLOY_USER }}@${{ env.PRODUCTION_HOST }} << 'ENDSSH'
            set -e
            cd /opt/7zi-frontend

            # 备份
            BACKUP_DIR="/opt/backups/7zi-frontend-$(date +%Y%m%d-%H%M%S)"
            mkdir -p "$BACKUP_DIR"
            cp -r .next "$BACKUP_DIR/" 2>/dev/null || true
            echo "📦 Backup created: $BACKUP_DIR"

            # 拉取代码
            git pull origin main

            # 部署
            if [ -f deploy-zero-downtime.sh ]; then
              chmod +x deploy-zero-downtime.sh
              ./deploy-zero-downtime.sh deploy
            else
              docker-compose -f docker-compose.prod.yml pull
              docker-compose -f docker-compose.prod.yml up -d --no-deps --build
            fi

            # 健康检查
            echo "Waiting for health check..."
            sleep 20
            for i in {1..10}; do
              if curl -sf http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ Production deployment successful!"

                # 清理旧备份
                ls -dt /opt/backups/7zi-frontend-* 2>/dev/null | tail -n +6 | xargs -r rm -rf

                exit 0
              fi
              echo "Attempt $i failed, retrying..."
              sleep 5
            done

            echo "❌ Health check failed! Rolling back..."
            docker-compose -f docker-compose.prod.yml down || true
            if [ -d "$BACKUP_DIR/.next" ]; then
              cp -r "$BACKUP_DIR/.next" ./
            fi
            docker-compose -f docker-compose.prod.yml up -d

            exit 1
          ENDSSH

      - name: Verify deployment
        run: |
          echo "Verifying production deployment..."
          for i in {1..10}; do
            if curl -sf https://7zi.com/ > /dev/null 2>&1; then
              echo "✅ Production is accessible"
              exit 0
            fi
            echo "Attempt $i failed, retrying..."
            sleep 5
          done
          echo "⚠️ Warning: Production verification failed"

      - name: Production deployment summary
        run: |
          echo "## 🚀 Production Deployment" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Deployment successful" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "🌐 URL: https://7zi.com" >> $GITHUB_STEP_SUMMARY

  # ============================================
  # Job 11: 通知
  # ============================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [build, test-unit, test-e2e, deploy-staging, deploy-production]
    if: always()
    steps:
      - name: Create deployment summary
        run: |
          echo "## 🚀 CI/CD Pipeline Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "### 📊 Job Status" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Build | ${{ needs.build.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Unit Tests | ${{ needs.test-unit.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| E2E Tests | ${{ needs.test-e2e.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Staging Deploy | ${{ needs.deploy-staging.result }} |" >> $GITHUB_STEP_SUMMARY
          echo "| Production Deploy | ${{ needs.deploy-production.result }} |" >> $GITHUB_STEP_SUMMARY

      - name: Send Discord notification
        if: always() && env.DISCORD_WEBHOOK != ''
        run: |
          COLOR="${{ contains(needs.*.result, 'failure') && '15158332' || '3066993' }}"
          curl -X POST ${{ secrets.DISCORD_WEBHOOK }} \
            -H "Content-Type: application/json" \
            -d "{
              \"embeds\": [{
                \"title\": \"${{ contains(needs.*.result, 'failure') && '❌ Pipeline Failed' : '✅ Pipeline Success' }}\",
                \"color\": ${COLOR},
                \"fields\": [
                  {\"name\": \"Repository\", \"value\": \"${{ github.repository }}\", \"inline\": true},
                  {\"name\": \"Branch\", \"value\": \"${{ github.ref_name }}\", \"inline\": true},
                  {\"name\": \"Commit\", \"value\": \"\`${{ github.sha }}\`\", \"inline\": false},
                  {\"name\": \"Actor\", \"value\": \"${{ github.actor }}\", \"inline\": true}
                ],
                \"url\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"
              }]
            }"
