<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background - rounded square with gradient -->
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="512" y2="512" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#0891b2"/>
    </linearGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="115" ry="115" fill="url(#bgGradient)"/>

  <!-- Main 7zi text/logo -->
  <text x="256" y="320" font-family="Arial, Helvetica, sans-serif" font-size="180" font-weight="bold" fill="white" text-anchor="middle">
    7zi
  </text>

  <!-- Decorative elements -->
  <circle cx="100" cy="120" r="30" fill="rgba(255,255,255,0.2)"/>
  <circle cx="412" cy="120" r="20" fill="rgba(255,255,255,0.15)"/>
  <circle cx="412" cy="400" r="25" fill="rgba(255,255,255,0.2)"/>
  <circle cx="100" cy="400" r="15" fill="rgba(255,255,255,0.1)"/>
</svg>
